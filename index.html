<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#085041">
<title>ItalySpots</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#1D9E75;--gl:#E1F5EE;--gd:#085041;
  --r:#D85A30;--rl:#FAECE7;
  --o:#BA7517;--ol:#FAEEDA;
  --bg:#f7f5f0;--w:#fff;
  --t1:#2C2C2A;--t2:#78716c;--t3:#a8a29e;
  --bdr:rgba(0,0,0,0.07);
  --nav:52px;
  --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1)}
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav);background:var(--gd);
  display:flex;align-items:center;padding:0 12px;gap:0;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#fff;margin-right:10px;white-space:nowrap}
.logo span{color:#f4a572}
.nav-tabs{display:flex;gap:2px;flex:1;overflow:hidden}
.ntab{padding:5px 10px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:none;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);font-family:'DM Sans',sans-serif;
  transition:all .2s;white-space:nowrap}
.ntab.on{background:rgba(255,255,255,.25);color:#fff}
.btn-plus{width:32px;height:32px;border-radius:50%;background:var(--r);border:none;cursor:pointer;
  color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(216,90,48,.4);transition:transform .15s;flex-shrink:0;margin-left:8px}
.btn-plus:active{transform:scale(.9)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-left:8px;flex-shrink:0;
  box-shadow:0 0 6px rgba(74,222,128,.6)}
.sync-dot.offline{background:#f87171;box-shadow:0 0 6px rgba(248,113,113,.6)}
.sync-dot.syncing{background:#fbbf24;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.view{position:fixed;top:var(--nav);left:0;right:0;bottom:0;display:none;overflow:hidden}
.view.on{display:block}
#mapView{background:#e8ede8}
#map{width:100%;height:100%}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:300;background:var(--w);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.13);
  will-change:transform;display:flex;flex-direction:column}
.handle-bar{width:36px;height:4px;background:#ddd;border-radius:2px}
.sheet-drag{padding:10px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:grab;flex-shrink:0;user-select:none}
.sheet-drag:active{cursor:grabbing}
.sheet-header{padding:0 14px 0;flex-shrink:0}
.sheet-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-title{font-family:'Playfair Display',serif;font-size:15px}
.sheet-count{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:20px}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:9px 34px;border:1.5px solid var(--bdr);border-radius:12px;
  font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;color:var(--t1);transition:border-color .2s}
.search-wrap input:focus{border-color:var(--g);background:#fff}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:15px;color:var(--t3);padding:2px;display:none}
.stabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:0}
.stab{flex:1;padding:7px 4px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;
  border:none;border-bottom:2px solid transparent;color:var(--t3);background:none;
  font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:-1px}
.stab.on{color:var(--gd);border-bottom-color:var(--gd)}
.sheet-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:var(--sab)}
.sec-head{padding:8px 14px 4px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;color:var(--t3);background:var(--bg);border-bottom:1px solid var(--bdr);
  border-top:1px solid var(--bdr);display:flex;align-items:center;gap:7px}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pitem{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid #fafaf8;cursor:pointer;transition:background .1s;position:relative}
.pitem:active{background:#f5f5f3}
.pitem.sel{background:var(--gl)}
.pitem-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.pitem-icon.todo{background:var(--rl)}
.pitem-icon.done{background:var(--gl)}
.pitem-body{flex:1;min-width:0}
.pitem-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.pitem-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px}
.pitem-stars{color:var(--o);font-size:10px}
.ibtns{display:flex;gap:5px;flex-shrink:0}
.ibtn{width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.ibtn:active{transform:scale(.88)}
.ibtn-check{background:var(--gl);color:var(--gd)}
.ibtn-del{background:var(--rl);color:var(--r)}
.empty-state{padding:36px 20px;text-align:center;color:var(--t3)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-msg{font-size:13px}

.dim{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:350;display:none;transition:background .3s}
.dim.on{display:block;background:rgba(0,0,0,.4)}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:400;background:var(--w);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.2);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:88vh;display:flex;flex-direction:column}
.drawer.open{transform:translateY(0)}
.drawer-handle{padding:10px 0 2px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.dhead{padding:2px 16px 12px;flex-shrink:0}
.dcat{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--o);margin-bottom:4px}
.dname{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;line-height:1.25;margin-bottom:3px}
.daddr{font-size:12px;color:var(--t2);margin-bottom:10px}
.dbadges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-todo{background:var(--rl);color:var(--r)}
.badge-done{background:var(--gl);color:var(--gd)}
.dbody{overflow-y:auto;flex:1;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.slabel{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin:14px 0 6px}
.stars-row{display:flex;gap:4px}
.star{font-size:28px;cursor:pointer;transition:transform .1s;color:#e5e2de;line-height:1}
.star.on{color:var(--o)}
.star:active{transform:scale(.85)}
.note-area{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:12px;
  font-size:13px;line-height:1.6;font-family:'DM Sans',sans-serif;background:var(--bg);
  color:var(--t1);resize:none;outline:none;min-height:70px}
.note-area:focus{border-color:var(--g);background:#fff}
.note-display{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;
  line-height:1.6;color:var(--t1);cursor:pointer;min-height:44px;border:1.5px solid transparent}
.note-display.empty{color:var(--t3);font-style:italic}
.note-hint{font-size:10px;color:var(--t3);margin-top:3px}
.date-field{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:11px;
  font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none}
.dfoot{padding:10px 16px;padding-bottom:max(14px,var(--sab));border-top:1px solid var(--bdr);
  display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.btn-full{width:100%;padding:13px;border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;
  border:none;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;
  gap:8px;transition:opacity .15s;text-decoration:none;color:inherit}
.btn-full:active{opacity:.8}
.btn-green{background:var(--gl);color:var(--gd)}
.btn-gray{background:var(--bg);color:var(--t1);border:1px solid var(--bdr)!important}
.btn-red{background:var(--rl);color:var(--r)}
.mini-save{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:500;background:var(--gd);
  color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
.mini-cancel{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:500;background:var(--bg);
  color:var(--t2);border:1px solid var(--bdr);cursor:pointer;font-family:'DM Sans',sans-serif;
  margin-top:6px;margin-left:6px}

#listView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--sab)}
.list-head{background:var(--w);padding:14px 14px 10px;border-bottom:1px solid var(--bdr);
  position:sticky;top:0;z-index:10}
.list-head-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:10px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;
  cursor:pointer;border:1px solid var(--bdr);background:#fff;color:var(--t2);
  font-family:'DM Sans',sans-serif;flex-shrink:0;transition:all .15s}
.fchip.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.list-section-head{padding:14px 14px 6px;display:flex;align-items:center;gap:8px}
.list-section-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:500}
.list-section-count{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:20px}
.list-section-line{height:2px;margin:0 14px 0;border-radius:1px}
.line-todo{background:linear-gradient(90deg,var(--r),transparent)}
.line-done{background:linear-gradient(90deg,var(--g),transparent)}
.list-cards{padding:10px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.pcard{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:12px;
  transition:all .2s;position:relative;overflow:hidden}
.pcard:active{transform:scale(.97)}
.pcard-bar{position:absolute;top:0;left:0;right:0;height:3px}
.pcard-bar.todo{background:linear-gradient(90deg,var(--r),#f4a572)}
.pcard-bar.done{background:linear-gradient(90deg,var(--g),#5dcaa5)}
.pcard-ico{font-size:22px;margin-bottom:5px;display:block}
.pcard-cat{font-size:10px;font-weight:500;color:var(--o);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.pcard-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px}
.pcard-city{font-size:11px;color:var(--t2);margin-bottom:7px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.pcard-del{width:26px;height:26px;border-radius:8px;border:none;background:var(--rl);
  color:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pcard-del:active{transform:scale(.88)}
.pcard-check{width:26px;height:26px;border-radius:8px;border:none;background:var(--gl);
  color:var(--gd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pcard-check:active{transform:scale(.88)}

#dashView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(14px + var(--sab))}
.dash-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:14px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.scard{border-radius:16px;padding:14px;text-align:center}
.scard-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;line-height:1}
.scard-l{font-size:11px;margin-top:3px;opacity:.8}
.prog-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px;margin-bottom:12px}
.prog-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:7px}
.prog-track{height:8px;background:#ede9e3;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gd),var(--g));transition:width .8s}
.prog-sub{display:flex;justify-content:space-between;font-size:11px;margin-top:5px}
.chart-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px;margin-bottom:10px}
.chart-t{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:11px;width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:#ede9e3;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s}
.bar-n{font-size:10px;color:var(--t3);width:16px;text-align:right;flex-shrink:0}
.top-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px}
.top-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fafaf8;cursor:pointer}
.top-row:last-child{border:none}

.modal-ov{position:fixed;inset:0;z-index:600;display:none;align-items:flex-end;background:rgba(0,0,0,0);transition:background .3s}
.modal-ov.open{display:flex;background:rgba(0,0,0,.45)}
.modal{background:var(--w);border-radius:24px 24px 0 0;width:100%;max-height:92vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
  padding-bottom:max(20px,var(--sab))}
.modal-ov.open .modal{transform:translateY(0)}
.modal-handle{padding:10px 0 2px;display:flex;justify-content:center}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 14px}
.modal-title{font-family:'Playfair Display',serif;font-size:18px}
.modal-x{background:none;border:none;cursor:pointer;font-size:22px;color:var(--t3);padding:0;line-height:1}
.mbody{padding:0 16px}
.mtabs{display:flex;gap:2px;background:#f0ede8;border-radius:12px;padding:3px;margin-bottom:16px}
.mtab{flex:1;padding:7px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:none;
  background:none;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px}
.mtab.on{background:#fff;color:var(--t1);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.fg{margin-bottom:11px}
.flbl{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:11px;
  font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);
  outline:none;-webkit-appearance:none;transition:border-color .2s}
.fi:focus{border-color:var(--g);background:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{width:100%;padding:13px;background:var(--gd);color:#fff;border:none;border-radius:13px;
  font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;margin-top:4px}
.pbtn:active{opacity:.8}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.msg-ok{background:var(--gl);border-radius:11px;padding:10px 13px;font-size:12px;color:var(--gd);
  display:flex;align-items:flex-start;gap:7px;margin-bottom:12px}
.msg-err{background:var(--rl);border-radius:11px;padding:10px 13px;font-size:12px;color:var(--r);margin-bottom:10px;line-height:1.5}

.toast{position:fixed;bottom:calc(80px + var(--sab));left:50%;
  transform:translateX(-50%) translateY(16px);
  background:#1c1c1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading screen */
.loading-screen{position:fixed;inset:0;background:var(--gd);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-logo{font-family:'Playfair Display',serif;font-size:28px;color:#fff}
.loading-logo span{color:#f4a572}
.loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-msg{font-size:13px;color:rgba(255,255,255,.6)}
@keyframes spin{to{transform:rotate(360deg)}}

.leaflet-popup-content-wrapper{border-radius:14px!important;box-shadow:0 8px 24px rgba(0,0,0,.15)!important;border:none!important;padding:0!important}
.leaflet-popup-content{margin:0!important;width:auto!important}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom{border:none!important;border-radius:12px!important;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)!important}
.leaflet-control-zoom a{color:var(--t1)!important;font-size:16px!important}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">Italy<span>Spots</span></div>
  <div class="loading-spinner"></div>
  <div class="loading-msg" id="loadingMsg">Connessione al database...</div>
</div>

<nav>
  <div class="logo">Italy<span>Spots</span></div>
  <div class="nav-tabs">
    <button class="ntab on" onclick="showView('map')">🗺 Mappa</button>
    <button class="ntab" onclick="showView('list')">☰ Lista</button>
    <button class="ntab" onclick="showView('dash')">📊 Statistiche</button>
  </div>
  <div class="sync-dot" id="syncDot" title="Sincronizzato"></div>
  <button class="btn-plus" onclick="openModal()">+</button>
</nav>

<div class="view on" id="mapView"><div id="map"></div></div>

<div class="sheet" id="sheet">
  <div class="sheet-drag" id="sheetDrag"><div class="handle-bar"></div></div>
  <div class="sheet-header">
    <div class="sheet-toprow">
      <span class="sheet-title">I miei luoghi</span>
      <span class="sheet-count" id="sheetCount">0</span>
    </div>
    <div class="search-wrap">
      <span class="si">🔍</span>
      <input type="search" id="sheetSearch" placeholder="Cerca nome, città, regione..." oninput="onSearch(this)">
      <button class="clr" id="clrBtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="stabs">
      <button class="stab on" onclick="setSheetF('all',this)">Tutti</button>
      <button class="stab" onclick="setSheetF('todo',this)">Da provare</button>
      <button class="stab" onclick="setSheetF('done',this)">Già provati</button>
    </div>
  </div>
  <div class="sheet-list" id="sheetList"></div>
</div>

<div class="dim" id="dim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle" onclick="closeDrawer()"><div class="handle-bar"></div></div>
  <div class="dhead" id="dHead"></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</div>

<div class="view" id="listView">
  <div class="list-head">
    <div class="list-head-title">I miei luoghi</div>
    <div class="fchips" id="fchips"></div>
  </div>
  <div id="listContent"></div>
</div>

<div class="view" id="dashView">
  <div class="dash-title">Le mie statistiche</div>
  <div id="dashInner"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════
const SB_URL = 'https://bruizoplaraqungtxehk.supabase.co';
const SB_KEY = 'sb_publishable_T9OKuMMG6-WKVWUCcYlN3Q_Ml64PC0Q';
const SB_HEADERS = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbGet(){
  const r = await fetch(`${SB_URL}/rest/v1/places?select=*&order=created_at.desc`, {headers: SB_HEADERS});
  if(!r.ok) throw new Error('GET failed');
  return r.json();
}
async function sbInsert(p){
  const r = await fetch(`${SB_URL}/rest/v1/places`, {
    method:'POST', headers: SB_HEADERS,
    body: JSON.stringify(toDb(p))
  });
  if(!r.ok) throw new Error('INSERT failed');
  const d = await r.json();
  return fromDb(d[0]);
}
async function sbUpdate(id, data){
  const r = await fetch(`${SB_URL}/rest/v1/places?id=eq.${id}`, {
    method:'PATCH', headers: SB_HEADERS,
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('UPDATE failed');
}
async function sbDelete(id){
  const r = await fetch(`${SB_URL}/rest/v1/places?id=eq.${id}`, {
    method:'DELETE', headers: SB_HEADERS
  });
  if(!r.ok) throw new Error('DELETE failed');
}

// Map between app fields and DB columns
function toDb(p){
  return {
    name: p.name, address: p.address||'', city: p.city,
    region: p.region||'', category: p.category,
    status: p.status, stars: p.stars||0,
    note: p.note||null, gm_url: p.gmUrl||null,
    lat: p.lat||null, lng: p.lng||null,
    visited: p.visited||null
  };
}
function fromDb(d){
  return {
    id: d.id, name: d.name, address: d.address||'',
    city: d.city, region: d.region||'', category: d.category||'Altro',
    status: d.status||'todo', stars: d.stars||0,
    note: d.note||'', gmUrl: d.gm_url||'',
    lat: d.lat, lng: d.lng,
    visited: d.visited||null,
    created: d.created_at?.slice(0,10)||''
  };
}

// ═══════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════
const IC={Ristorante:'🍽️',Bar:'☕',Pasticceria:'🥐',Hotel:'🏨',Spiaggia:'🏖️',Attività:'🎯',Negozio:'🛍️',Altro:'📍'};
let places=[],selId=null,sheetF='all',listF='all',editNote=false,geocoded=null,confirmed=false;
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{if(!d)return'';try{return new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}};

function setSyncDot(s){
  const d=document.getElementById('syncDot');
  d.className='sync-dot'+(s==='offline'?' offline':s==='syncing'?' syncing':'');
  d.title=s==='offline'?'Offline':s==='syncing'?'Sincronizzazione...':'Sincronizzato';
}

// ═══════════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════════
let map,mks={};
function initMap(){
  map=L.map('map',{center:[42.5,12.5],zoom:6,zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
  }).addTo(map);
  map.zoomControl.setPosition('bottomright');
}
function makeIcon(p,sel){
  const col=p.status==='done'?'#1D9E75':'#D85A30';
  const em=IC[p.category]||'📍';
  const r=sel?20:15;
  const pulse=sel?`<circle cx="24" cy="22" r="22" fill="${col}" opacity=".15"/>`:'';
  return L.divIcon({
    html:`<svg width="${r*2+10}" height="${r*2+20}" viewBox="0 0 58 62" xmlns="http://www.w3.org/2000/svg">
      ${pulse}<circle cx="29" cy="24" r="${r}" fill="${col}"/>
      <circle cx="29" cy="24" r="${r-3}" fill="rgba(255,255,255,.2)"/>
      <text x="29" y="30" text-anchor="middle" font-size="${r-1}">${em}</text>
      <path d="M29 46 L23 34 Q29 39 35 34Z" fill="${col}"/>
    </svg>`,
    className:'',iconSize:[r*2+10,r*2+20],iconAnchor:[r+5,r*2+20]
  });
}
function renderMap(){
  if(!map)return;
  Object.values(mks).forEach(m=>map.removeLayer(m));mks={};
  places.forEach(p=>{
    if(!p.lat||!p.lng)return;
    const sel=selId===p.id;
    const m=L.marker([p.lat,p.lng],{icon:makeIcon(p,sel),zIndexOffset:sel?1000:0});
    const col=p.status==='done'?'#085041':'#D85A30';
    const bg=p.status==='done'?'#E1F5EE':'#FAECE7';
    m.bindPopup(`<div style="padding:11px 14px;font-family:'DM Sans',sans-serif;min-width:160px">
      <div style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:#BA7517;margin-bottom:3px">${IC[p.category]||''} ${p.category}</div>
      <div style="font-size:14px;font-weight:500;font-family:'Playfair Display',serif;line-height:1.25;margin-bottom:2px">${p.name}</div>
      <div style="font-size:11px;color:#78716c;margin-bottom:6px">${p.city}${p.region?', '+p.region:''}</div>
      ${p.stars?`<div style="font-size:12px;color:#BA7517;margin-bottom:5px">${'★'.repeat(p.stars)}</div>`:''}
      <span style="font-size:10px;font-weight:500;padding:2px 9px;border-radius:20px;background:${bg};color:${col}">${p.status==='done'?'✓ Già provato':'● Da provare'}</span>
    </div>`,{maxWidth:240,closeButton:false,autoPan:false});
    m.on('click',()=>{selId=p.id;renderMap();renderSheet();openDrawer(p.id);});
    if(sel)setTimeout(()=>m.openPopup(),80);
    m.addTo(map);mks[p.id]=m;
  });
}

// ═══════════════════════════════════════════════
// SHEET
// ═══════════════════════════════════════════════
let snapState='peek',dragging=false,dragStartY=0,dragStartTY=0,currentTY=0;
const PEEK=()=>window.innerHeight-72-52;
const HALF=()=>window.innerHeight*0.45;
const FULL=()=>60;
function initSheet(){
  const sheet=document.getElementById('sheet');
  const drag=document.getElementById('sheetDrag');
  sheet.style.height=(window.innerHeight-52)+'px';
  setSnap('peek',false);
  drag.addEventListener('touchstart',e=>{dragging=true;dragStartY=e.touches[0].clientY;dragStartTY=currentTY;sheet.style.transition='none';},{passive:true});
  drag.addEventListener('touchmove',e=>{if(!dragging)return;const dy=e.touches[0].clientY-dragStartY;const ny=Math.max(FULL()-10,Math.min(dragStartTY+dy,PEEK()+20));currentTY=ny;sheet.style.transform=`translateY(${ny}px)`;},{passive:true});
  drag.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;sheet.style.transition='';const dy=e.changedTouches[0].clientY-dragStartY;setSnap(dy<-60?(snapState==='peek'?'half':'full'):dy>60?(snapState==='full'?'half':'peek'):snapState);});
  drag.addEventListener('click',()=>setSnap(snapState==='peek'?'half':snapState==='half'?'full':'peek'));
  window.addEventListener('resize',()=>{sheet.style.height=(window.innerHeight-52)+'px';setSnap(snapState,false);});
}
function setSnap(s,anim=true){
  snapState=s;const sheet=document.getElementById('sheet');
  sheet.style.transition=anim?'transform .35s cubic-bezier(.32,.72,0,1)':'none';
  const ty=s==='full'?FULL():s==='half'?HALF():PEEK();
  currentTY=ty;sheet.style.transform=`translateY(${ty}px)`;
  if(!anim)requestAnimationFrame(()=>sheet.style.transition='');
}
function onSearch(inp){document.getElementById('clrBtn').style.display=inp.value?'block':'none';renderSheet();}
function clearSearch(){document.getElementById('sheetSearch').value='';document.getElementById('clrBtn').style.display='none';renderSheet();}
function setSheetF(f,el){sheetF=f;document.querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderSheet();}
function getSheetItems(){
  const q=(document.getElementById('sheetSearch')||{}).value?.toLowerCase()||'';
  return places.filter(p=>{
    if(sheetF==='todo'&&p.status!=='todo')return false;
    if(sheetF==='done'&&p.status!=='done')return false;
    if(q)return p.name.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)||(p.region||'').toLowerCase().includes(q);
    return true;
  });
}
function renderSheet(){
  const items=getSheetItems();
  document.getElementById('sheetCount').textContent=items.length;
  const el=document.getElementById('sheetList');
  if(!items.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-msg">Nessun luogo trovato</div></div>';return;}
  let html='';
  if(sheetF==='all'){
    const todo=items.filter(p=>p.status==='todo');
    const done=items.filter(p=>p.status==='done');
    if(todo.length){html+=`<div class="sec-head"><span class="sec-dot" style="background:var(--r)"></span>Da provare <span style="font-size:10px;color:var(--t3)">(${todo.length})</span></div>`;html+=todo.map(pitemHtml).join('');}
    if(done.length){html+=`<div class="sec-head"><span class="sec-dot" style="background:var(--g)"></span>Già provati <span style="font-size:10px;color:var(--t3)">(${done.length})</span></div>`;html+=done.map(pitemHtml).join('');}
  } else { html=items.map(pitemHtml).join(''); }
  el.innerHTML=html;
}
function pitemHtml(p){
  return`<div class="pitem${selId===p.id?' sel':''}" onclick="tapItem('${p.id}')">
    <div class="pitem-icon ${p.status}">${IC[p.category]||'📍'}</div>
    <div class="pitem-body">
      <div class="pitem-name">${p.name}</div>
      <div class="pitem-meta">${p.city}${p.region?' · '+p.region:''} ${p.stars?`<span class="pitem-stars">${'★'.repeat(p.stars)}</span>`:''}</div>
    </div>
    <div class="ibtns">
      ${p.status==='todo'?`<button class="ibtn ibtn-check" onclick="quickDone(event,'${p.id}')" title="Segna come provato">✓</button>`:''}
      <button class="ibtn ibtn-del" onclick="quickDel(event,'${p.id}')" title="Elimina">🗑</button>
    </div>
  </div>`;
}
function tapItem(id){
  selId=id;const p=places.find(x=>x.id===id);if(!p)return;
  renderMap();renderSheet();
  if(p.lat&&p.lng&&map)map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),13),{animate:true,duration:.6});
  setSnap('peek');setTimeout(()=>openDrawer(id),300);
}
async function quickDone(e,id){
  e.stopPropagation();
  const p=places.find(x=>x.id===id);if(!p)return;
  p.status='done';p.visited=today();
  renderSheet();renderMap();showToast('✓ Segnato come provato!');
  setSyncDot('syncing');
  try{await sbUpdate(id,{status:'done',visited:today()});setSyncDot('ok');}
  catch(err){setSyncDot('offline');showToast('⚠️ Errore sync');}
}
async function quickDel(e,id){
  e.stopPropagation();
  const p=places.find(x=>x.id===id);if(!p||!confirm('Eliminare "'+p.name+'"?'))return;
  places=places.filter(x=>x.id!==id);
  if(selId===id){selId=null;closeDrawer();}
  renderSheet();renderMap();showToast('Luogo eliminato');
  setSyncDot('syncing');
  try{await sbDelete(id);setSyncDot('ok');}
  catch(err){setSyncDot('offline');}
}

// ═══════════════════════════════════════════════
// DRAWER
// ═══════════════════════════════════════════════
function openDrawer(id){
  const p=places.find(x=>x.id===id);if(!p)return;
  editNote=false;renderDrawer(p);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dim').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('dim').classList.remove('on');
  selId=null;editNote=false;renderMap();renderSheet();
}
function renderDrawer(p){
  document.getElementById('dHead').innerHTML=`
    <div class="dcat">${IC[p.category]||''} ${p.category}</div>
    <div class="dname">${p.name}</div>
    <div class="daddr">${[p.address,p.city,p.region].filter(Boolean).join(', ')}</div>
    <div class="dbadges">
      <span class="badge badge-${p.status}">${p.status==='done'?'✓ Già provato':'● Da provare'}</span>
      ${p.visited?`<span style="font-size:11px;color:var(--t3)">${fmtD(p.visited)}</span>`:''}
    </div>`;
  const stars=[1,2,3,4,5].map(n=>`<span class="star${n<=p.stars?' on':''}" onclick="setStar('${p.id}',${n})">★</span>`).join('');
  const noteHtml=editNote
    ?`<textarea class="note-area" id="noteEdit" rows="3">${p.note||''}</textarea>
      <button class="mini-save" onclick="saveNote('${p.id}')">Salva</button>
      <button class="mini-cancel" onclick="cancelNote('${p.id}')">Annulla</button>`
    :`<div class="note-display${!p.note?' empty':''}" onclick="startNote('${p.id}')">${p.note||'Tocca per aggiungere una nota...'}</div>
      <div class="note-hint">Tocca per modificare</div>`;
  document.getElementById('dBody').innerHTML=`
    <div class="slabel">Valutazione</div><div class="stars-row">${stars}</div>
    <div class="slabel">Note personali</div>${noteHtml}
    ${p.status==='done'?`<div class="slabel">Data visita</div>
      <input class="date-field" type="date" value="${p.visited||''}" onchange="setVisit('${p.id}',this.value)">`:''}
    <div style="font-size:11px;color:var(--t3);margin-top:14px">Aggiunto il ${fmtD(p.created)}</div>`;
  const mapsUrl=p.lat&&p.lng
    ?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`
    :`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+p.city)}`;
  let foot='';
  if(p.status==='todo')foot+=`<button class="btn-full btn-green" onclick="markDone('${p.id}')">✓ Segna come provato</button>`;
  foot+=`<a class="btn-full btn-gray" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">↗ Apri in Google Maps</a>`;
  foot+=`<button class="btn-full btn-red" onclick="delFromDrawer('${p.id}')">🗑 Elimina luogo</button>`;
  document.getElementById('dFoot').innerHTML=foot;
}
async function setStar(id,n){
  const p=places.find(x=>x.id===id);if(!p)return;
  p.stars=p.stars===n?0:n;renderDrawer(p);renderSheet();showToast('Valutazione salvata');
  setSyncDot('syncing');
  try{await sbUpdate(id,{stars:p.stars});setSyncDot('ok');}catch(e){setSyncDot('offline');}
}
async function setVisit(id,v){
  const p=places.find(x=>x.id===id);if(!p)return;
  p.visited=v;
  try{await sbUpdate(id,{visited:v||null});}catch(e){}
}
function startNote(id){editNote=true;const p=places.find(x=>x.id===id);if(p)renderDrawer(p);}
function cancelNote(id){editNote=false;const p=places.find(x=>x.id===id);if(p)renderDrawer(p);}
async function saveNote(id){
  const p=places.find(x=>x.id===id);if(!p)return;
  p.note=(document.getElementById('noteEdit')||{}).value||'';
  editNote=false;renderDrawer(p);showToast('Nota salvata');
  setSyncDot('syncing');
  try{await sbUpdate(id,{note:p.note});setSyncDot('ok');}catch(e){setSyncDot('offline');}
}
async function markDone(id){
  const p=places.find(x=>x.id===id);if(!p)return;
  p.status='done';p.visited=today();renderDrawer(p);renderSheet();renderMap();showToast('✓ Segnato come provato!');
  setSyncDot('syncing');
  try{await sbUpdate(id,{status:'done',visited:today()});setSyncDot('ok');}catch(e){setSyncDot('offline');}
}
async function delFromDrawer(id){
  const p=places.find(x=>x.id===id);if(!p||!confirm('Eliminare "'+p.name+'"?'))return;
  places=places.filter(x=>x.id!==id);closeDrawer();renderAll();showToast('Luogo eliminato');
  setSyncDot('syncing');
  try{await sbDelete(id);setSyncDot('ok');}catch(e){setSyncDot('offline');}
}

// ═══════════════════════════════════════════════
// LIST VIEW
// ═══════════════════════════════════════════════
function renderList(){
  const cats=['all',...Object.keys(IC).filter(c=>places.some(p=>p.category===c))];
  document.getElementById('fchips').innerHTML=cats.map(c=>`
    <button class="fchip${listF===c?' on':''}" onclick="setListF('${c}')">${c==='all'?'Tutti':(IC[c]||'')+' '+c}</button>`).join('');
  const fil=listF==='all'?places:places.filter(p=>p.category===listF);
  const todo=fil.filter(p=>p.status==='todo');
  const done=fil.filter(p=>p.status==='done');
  let html='';
  if(!fil.length){html='<div class="empty-state" style="padding:40px 20px;text-align:center;color:var(--t3)"><div class="empty-icon">🗺️</div><div class="empty-msg">Nessun luogo</div></div>';document.getElementById('listContent').innerHTML=html;return;}
  if(todo.length){html+=`<div class="list-section-head"><span class="list-section-title" style="color:var(--r)">Da provare</span><span class="list-section-count">${todo.length}</span></div><div class="list-section-line line-todo"></div><div class="list-cards">${todo.map(pcardHtml).join('')}</div>`;}
  if(done.length){html+=`<div class="list-section-head" style="margin-top:4px"><span class="list-section-title" style="color:var(--gd)">Già provati</span><span class="list-section-count">${done.length}</span></div><div class="list-section-line line-done"></div><div class="list-cards">${done.map(pcardHtml).join('')}</div>`;}
  document.getElementById('listContent').innerHTML=html;
}
function pcardHtml(p){
  return`<div class="pcard" onclick="goToMap('${p.id}')">
    <div class="pcard-bar ${p.status}"></div>
    <span class="pcard-ico">${IC[p.category]||'📍'}</span>
    <div class="pcard-cat">${p.category}</div>
    <div class="pcard-name">${p.name}</div>
    <div class="pcard-city">${p.city}${p.region?', '+p.region:''}</div>
    <div class="pcard-foot">
      <div style="display:flex;gap:4px;align-items:center">
        ${p.status==='todo'?`<button class="pcard-check" onclick="listQuickDone(event,'${p.id}')" title="Segna come provato">✓</button>`:''}
        <button class="pcard-del" onclick="listQuickDel(event,'${p.id}')" title="Elimina">🗑</button>
      </div>
      ${p.stars?`<span style="font-size:10px;color:var(--o)">${'★'.repeat(p.stars)}</span>`:''}
    </div>
  </div>`;
}
function setListF(f){listF=f;renderList();}
function goToMap(id){selId=id;showView('map');setTimeout(()=>tapItem(id),200);}
async function listQuickDone(e,id){
  e.stopPropagation();
  const p=places.find(x=>x.id===id);if(!p)return;
  p.status='done';p.visited=today();renderList();renderMap();showToast('✓ Segnato come provato!');
  setSyncDot('syncing');
  try{await sbUpdate(id,{status:'done',visited:today()});setSyncDot('ok');}catch(err){setSyncDot('offline');}
}
async function listQuickDel(e,id){
  e.stopPropagation();
  const p=places.find(x=>x.id===id);if(!p||!confirm('Eliminare "'+p.name+'"?'))return;
  places=places.filter(x=>x.id!==id);renderList();renderMap();showToast('Luogo eliminato');
  setSyncDot('syncing');
  try{await sbDelete(id);setSyncDot('ok');}catch(err){setSyncDot('offline');}
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDash(){
  const done=places.filter(p=>p.status==='done').length;
  const todo=places.length-done;
  const rated=places.filter(p=>p.stars>0);
  const avg=rated.length?(rated.reduce((s,p)=>s+p.stars,0)/rated.length).toFixed(1):0;
  const pct=places.length?Math.round(done/places.length*100):0;
  const cats={},regs={};
  places.forEach(p=>{cats[p.category]=(cats[p.category]||0)+1;if(p.region)regs[p.region]=(regs[p.region]||0)+1;});
  const tc=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const tr=Object.entries(regs).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mc=tc[0]?.[1]||1,mr=tr[0]?.[1]||1;
  const top=[...places].filter(p=>p.stars>0).sort((a,b)=>b.stars-a.stars).slice(0,5);
  document.getElementById('dashInner').innerHTML=`
    <div class="stats2">
      <div class="scard" style="background:var(--gl)"><div class="scard-n" style="color:var(--gd)">${places.length}</div><div class="scard-l" style="color:var(--gd)">Totale luoghi</div></div>
      <div class="scard" style="background:var(--rl)"><div class="scard-n" style="color:var(--r)">${todo}</div><div class="scard-l" style="color:var(--r)">Da provare</div></div>
      <div class="scard" style="background:var(--gl)"><div class="scard-n" style="color:var(--gd)">${done}</div><div class="scard-l" style="color:var(--gd)">Già provati</div></div>
      <div class="scard" style="background:var(--ol)"><div class="scard-n" style="color:var(--o)">${avg>0?avg+'★':'—'}</div><div class="scard-l" style="color:var(--o)">Media stelle</div></div>
    </div>
    ${places.length?`<div class="prog-card"><div class="prog-lbl"><span>Progressi</span><span style="font-weight:500">${pct}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-sub"><span style="color:var(--gd)">${done} provati</span><span style="color:var(--r)">${todo} da provare</span></div></div>`:''}
    <div class="chart-card"><div class="chart-t">Per categoria</div>${tc.map(([k,v])=>`<div class="bar-row"><div class="bar-lbl">${IC[k]||''} ${k}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/mc*100)}%;background:var(--o)"></div></div><div class="bar-n">${v}</div></div>`).join('')}</div>
    ${tr.length?`<div class="chart-card"><div class="chart-t">Per regione</div>${tr.map(([k,v])=>`<div class="bar-row"><div class="bar-lbl">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/mr*100)}%;background:var(--g)"></div></div><div class="bar-n">${v}</div></div>`).join('')}</div>`:''}
    ${top.length?`<div class="top-card"><div class="chart-t">I miei migliori ⭐</div>${top.map((p,i)=>`<div class="top-row" onclick="goToMap('${p.id}')"><span style="font-size:11px;color:var(--t3);width:16px">${i+1}</span><span style="font-size:16px">${IC[p.category]||''}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><div style="font-size:11px;color:var(--t2)">${p.city}</div></div><span style="font-size:12px;color:var(--o)">${'★'.repeat(p.stars)}</span></div>`).join('')}</div>`:''}`;
}

// ═══════════════════════════════════════════════
// VIEWS
// ═══════════════════════════════════════════════
function showView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(e=>e.classList.remove('on'));
  document.getElementById(v+'View').classList.add('on');
  document.querySelectorAll('.ntab')[{map:0,list:1,dash:2}[v]]?.classList.add('on');
  document.getElementById('sheet').style.display=v==='map'?'flex':'none';
  if(v==='map')setTimeout(()=>map&&map.invalidateSize(),50);
  if(v==='list')renderList();
  if(v==='dash')renderDash();
}
function renderAll(){renderMap();renderSheet();}

// ═══════════════════════════════════════════════
// GEOCODE
// ═══════════════════════════════════════════════
async function doGeo(){
  const raw=document.getElementById('gmIn').value.trim();
  if(!raw){document.getElementById('urlMsg').innerHTML='<div class="msg-err">Incolla un link Google Maps.</div>';return;}
  const btn=document.getElementById('geoBtn');
  document.getElementById('geoTxt').innerHTML='⏳ Ricerca...';btn.disabled=true;
  document.getElementById('urlMsg').innerHTML='';document.getElementById('urlRes').innerHTML='';
  let lat=null,lng=null,name='',city='',region='',address='';
  const m1=raw.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m1){lat=parseFloat(m1[1]);lng=parseFloat(m1[2]);}
  if(!lat){const m2=raw.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);if(m2){lat=parseFloat(m2[1]);lng=parseFloat(m2[2]);}}
  if(!lat){const m3=raw.match(/ll=(-?\d+\.\d+),(-?\d+\.\d+)/);if(m3){lat=parseFloat(m3[1]);lng=parseFloat(m3[2]);}}
  let placeName='';const m4=raw.match(/\/place\/([^/@?&+\n]+)/);
  if(m4)placeName=decodeURIComponent(m4[1].replace(/\+/g,' ').replace(/_/g,' ')).trim();
  if(lat&&lng){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1`,{headers:{'Accept-Language':'it','User-Agent':'ItalySpots/1.0'}});
      const d=await r.json();if(d&&!d.error){name=placeName||d.name||d.display_name?.split(',')[0]||'';const a=d.address||{};city=a.city||a.town||a.village||a.municipality||a.suburb||'';region=a.state||'';address=(a.road||'')+(a.house_number?' '+a.house_number:'');}}catch(e){}
  }
  if(!lat){const q=placeName||(raw.startsWith('http')?'':raw);if(q){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Italy')}&format=json&limit=1&addressdetails=1&countrycodes=it`,{headers:{'Accept-Language':'it','User-Agent':'ItalySpots/1.0'}});
      const d=await r.json();if(d&&d[0]){lat=parseFloat(d[0].lat);lng=parseFloat(d[0].lon);const a=d[0].address||{};name=d[0].name||q;city=a.city||a.town||a.village||a.municipality||'';region=a.state||'';address=(a.road||'')+(a.house_number?' '+a.house_number:'');}}catch(e){}
  }}
  btn.disabled=false;document.getElementById('geoTxt').textContent='🔍 Trova luogo';
  if(!lat||!lng){
    document.getElementById('urlMsg').innerHTML=`<div class="msg-err">⚠️ Coordinate non trovate.<br><br><strong>Come copiare il link:</strong><br>1. Apri Google Maps → cerca il posto<br>2. Tocca "Condividi" → "Copia link"<br>3. Incolla qui il link copiato<br><br>Oppure usa il tab <strong>Manuale</strong>.</div>`;return;
  }
  geocoded={lat,lng};
  if(name)document.getElementById('fName').value=name;
  if(city)document.getElementById('fCity').value=city;
  if(region)document.getElementById('fRegion').value=region;
  if(address)document.getElementById('fAddr').value=address;
  document.getElementById('coordHint').innerHTML=`📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  document.getElementById('urlRes').innerHTML=`<div class="msg-ok" style="margin-top:10px">✅ <strong>${name||'Luogo trovato'}</strong>${city?', '+city:''}</div><button class="pbtn" style="margin-top:6px" onclick="confirmGeo()">Continua → Compila i dettagli</button>`;
}
function confirmGeo(){confirmed=true;document.getElementById('urlFlow').style.display='none';document.getElementById('formFlow').style.display='block';document.getElementById('backBtn').style.display='inline-flex';document.getElementById('fMsg').innerHTML='<div class="msg-ok" style="margin-bottom:12px">✅ Posizione trovata! Controlla e salva.</div>';}
function backUrl(){confirmed=false;document.getElementById('urlFlow').style.display='block';document.getElementById('formFlow').style.display='none';}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function openModal(){document.getElementById('modalOv').classList.add('open');resetModal();}
function closeModal(){document.getElementById('modalOv').classList.remove('open');}
function handleOvClick(e){if(e.target===document.getElementById('modalOv'))closeModal();}
function resetModal(){
  geocoded=null;confirmed=false;
  ['gmIn','fName','fCity','fRegion','fAddr','fNote'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  ['urlMsg','urlRes','fMsg','fErr','coordHint'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
  document.getElementById('fStat').value='todo';document.getElementById('fStars').value='0';
  document.getElementById('fVisit').value='';document.getElementById('doneF').style.display='none';
  document.getElementById('backBtn').style.display='none';switchTab('url');
}
function switchTab(t){
  document.getElementById('mtu').classList.toggle('on',t==='url');document.getElementById('mtm').classList.toggle('on',t==='manual');
  document.getElementById('urlFlow').style.display=(t==='url'&&!confirmed)?'block':'none';
  document.getElementById('formFlow').style.display=(t==='manual'||confirmed)?'block':'none';
  if(t==='manual'){document.getElementById('backBtn').style.display='none';document.getElementById('fMsg').innerHTML='';}
}
function togDone(){document.getElementById('doneF').style.display=document.getElementById('fStat').value==='done'?'grid':'none';}

async function savePlace(){
  const name=document.getElementById('fName').value.trim();
  const city=document.getElementById('fCity').value.trim();
  if(!name||!city){document.getElementById('fErr').innerHTML='<div class="msg-err">Nome e città sono obbligatori.</div>';return;}
  const status=document.getElementById('fStat').value;
  const p={
    id:'tmp_'+Date.now(), name, city,
    region:document.getElementById('fRegion').value.trim(),
    address:document.getElementById('fAddr').value.trim(),
    category:document.getElementById('fCat').value, status,
    stars:parseInt(document.getElementById('fStars').value)||0,
    note:document.getElementById('fNote').value.trim(),
    gmUrl:document.getElementById('gmIn').value.trim()||'',
    lat:geocoded?.lat||null, lng:geocoded?.lng||null,
    visited:status==='done'?(document.getElementById('fVisit').value||today()):null,
    created:today()
  };
  // Optimistic UI
  places.unshift(p);closeModal();renderAll();showToast('💾 Salvataggio...');
  setSyncDot('syncing');
  try{
    const saved=await sbInsert(p);
    // Replace temp with real DB record
    places=places.map(x=>x.id===p.id?saved:x);
    renderAll();showToast('✅ '+name+' aggiunto!');setSyncDot('ok');
  }catch(err){
    setSyncDot('offline');showToast('⚠️ Errore salvataggio');
  }
  if(p.lat&&p.lng&&map){
    selId=p.id;showView('map');
    setTimeout(()=>{map.flyTo([p.lat,p.lng],14,{animate:true,duration:.8});renderMap();renderSheet();setTimeout(()=>openDrawer(p.id),900);},200);
  }
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ═══════════════════════════════════════════════
// INIT — carica dati da Supabase
// ═══════════════════════════════════════════════
async function init(){
  initMap();initSheet();
  document.getElementById('loadingMsg').textContent='Caricamento luoghi...';
  try{
    const data=await sbGet();
    places=data.map(fromDb);
    setSyncDot('ok');
  }catch(err){
    setSyncDot('offline');
    document.getElementById('loadingMsg').textContent='Offline — dati non disponibili';
    await new Promise(r=>setTimeout(r,1500));
  }
  document.getElementById('loadingScreen').style.display='none';
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
</script>
