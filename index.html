<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItalySpots</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#1D9E75;--verde-l:#E1F5EE;--verde-d:#085041;
  --rosso:#D85A30;--rosso-l:#FAECE7;
  --oro:#BA7517;--oro-l:#FAEEDA;
  --bg:#f8f6f1;--white:#ffffff;
  --t1:#2C2C2A;--t2:#78716c;--t3:#a8a29e;
  --border:rgba(0,0,0,0.08);
  --radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}

/* NAV */
nav{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;z-index:1000}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--verde-d);margin-right:8px}
.logo span{color:var(--rosso)}
.tabs{display:flex;gap:2px}
.tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .2s}
.tab.active{background:var(--verde-d);color:#fff}
.tab:hover:not(.active){background:#f5f5f4}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-add{padding:7px 14px;background:var(--rosso);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-add:hover{background:#b84825}

/* VIEWS */
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex}

/* MAP */
#map-view{flex-direction:row}
.sidebar{width:268px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-top{padding:10px;border-bottom:1px solid var(--border)}
.search-box{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none}
.search-box:focus{border-color:var(--verde)}
.chips{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--t2);transition:all .15s;font-family:'DM Sans',sans-serif}
.chip.on{background:var(--verde-d);color:#fff;border-color:var(--verde-d)}
.sidebar-count{padding:6px 12px;font-size:11px;color:var(--t3);border-bottom:1px solid var(--border);background:#fafaf9}
.place-list{flex:1;overflow-y:auto}
.pitem{padding:9px 12px;cursor:pointer;border-bottom:1px solid #fafaf9;transition:background .1s;border-left:3px solid transparent}
.pitem:hover{background:#fafaf9}
.pitem.sel{background:var(--verde-l);border-left-color:var(--verde)}
.pitem-name{font-size:12px;font-weight:500;margin-bottom:2px}
.pitem-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-todo{background:var(--rosso)}
.dot-done{background:var(--verde)}
.ccat{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--oro-l);color:var(--oro);font-weight:500}

/* MAP AREA */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}
.map-legend{position:absolute;bottom:12px;right:12px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:11px;z-index:800;pointer-events:none}
.leg-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.leg-row:last-child{margin-bottom:0}

/* DETAIL PANEL */
.detail{position:absolute;right:0;top:0;bottom:0;width:264px;background:var(--white);border-left:1px solid var(--border);z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-4px 0 20px rgba(0,0,0,.06)}
.detail.open{transform:translateX(0)}
.detail-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.detail-close{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;color:var(--t3);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.detail-close:hover{background:#f5f5f4;color:var(--t1)}
.detail-cat{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--oro);margin-bottom:3px}
.detail-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;line-height:1.3;margin-bottom:3px;padding-right:24px}
.detail-addr{font-size:11px;color:var(--t2)}
.detail-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.stars-row{display:flex;gap:3px}
.star{font-size:20px;cursor:pointer;color:#d6d3d1;transition:color .1s}
.star.on{color:var(--oro)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-todo{background:var(--rosso-l);color:var(--rosso)}
.badge-done{background:var(--verde-l);color:var(--verde-d)}
.note-box{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;color:var(--t1)}
.note-box.empty{color:var(--t3);font-style:italic}
.detail-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.btn-action{width:100%;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s}
.btn-action:hover{border-color:#a8a29e;background:#fafaf9}
.btn-done-action{background:var(--verde-l);border-color:var(--verde);color:var(--verde-d)}
.btn-done-action:hover{background:#c8eddf}
.btn-del{background:var(--rosso-l);border-color:var(--rosso);color:var(--rosso)}
.btn-del:hover{background:#f5c4b3}

/* TEXTAREA inline edit */
.note-edit{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;line-height:1.6;font-family:'DM Sans',sans-serif;background:var(--bg);resize:none;outline:none}
.note-edit:focus{border-color:var(--verde)}
.mini-btns{display:flex;gap:6px}
.btn-mini{flex:1;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border)}
.btn-mini.pri{background:var(--verde-d);color:#fff;border-color:var(--verde-d)}
.btn-mini.sec{background:#fff;color:var(--t2)}

/* LIST VIEW */
#list-view{flex-direction:column}
.list-head{background:var(--white);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.list-title{font-family:'Playfair Display',serif;font-size:16px}
.fselect{padding:5px 9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--t1);cursor:pointer;outline:none}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:14px 16px;overflow-y:auto;flex:1}
.pcard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .2s;position:relative}
.pcard:hover{border-color:#a8a29e;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pcard-cat{font-size:10px;font-weight:500;color:var(--oro);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.pcard-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;margin-bottom:3px;line-height:1.3}
.pcard-city{font-size:11px;color:var(--t2);margin-bottom:8px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between}
.pcard-stars{font-size:11px;color:var(--oro)}
.pcard-note{font-size:10px;color:var(--t3);margin-top:6px;line-height:1.5;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard-actions{position:absolute;top:8px;right:8px;gap:4px;display:none}
.pcard:hover .pcard-actions{display:flex}
.icon-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.icon-btn:hover{background:#f5f5f4;border-color:#a8a29e}

/* DASHBOARD */
#dash-view{flex-direction:column;overflow-y:auto}
.dash-inner{max-width:800px;margin:0 auto;padding:16px;width:100%}
.dash-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.scard{border-radius:var(--radius);padding:14px;text-align:center}
.scard-n{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;line-height:1}
.scard-l{font-size:11px;margin-top:3px}
.prog-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.prog-track{height:7px;background:#f0ede8;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.prog-fill{height:100%;border-radius:4px;background:var(--verde);transition:width .7s ease}
.prog-labels{display:flex;justify-content:space-between;font-size:11px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:500px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.chart-title{font-family:'Playfair Display',serif;font-size:14px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.bar-label{font-size:11px;width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:5px;background:#f0ede8;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .7s}
.bar-fill.cat{background:var(--oro)}
.bar-fill.reg{background:var(--verde)}
.bar-n{font-size:10px;color:var(--t3);width:14px;text-align:right;flex-shrink:0}
.top-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.top-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #fafaf9}
.top-row:last-child{border-bottom:none}
.top-n{font-size:12px;color:var(--t3);width:14px}
.top-info{flex:1;min-width:0}
.top-name{font-size:13px;font-weight:500;truncate}
.top-city{font-size:11px;color:var(--t2)}
.top-stars{font-size:12px;color:var(--oro);flex-shrink:0}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Playfair Display',serif;font-size:17px}
.modal-x{background:none;border:none;cursor:pointer;color:var(--t3);font-size:20px;line-height:1;padding:0 4px}
.modal-x:hover{color:var(--t1)}
.modal-body{padding:16px}
.mtabs{display:flex;gap:2px;background:#f5f5f4;border-radius:10px;padding:3px;margin-bottom:14px}
.mtab{flex:1;padding:6px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--t2);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.mtab.on{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fg{margin-bottom:10px}
.flabel{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.finput{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none;transition:border-color .2s}
.finput:focus{border-color:var(--verde);background:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-parse{width:100%;padding:10px;background:var(--verde-d);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.btn-parse:hover:not(:disabled){background:#0a6350}
.btn-parse:disabled{opacity:.5;cursor:not-allowed}
.btn-save{width:100%;padding:10px;background:var(--verde-d);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:background .2s}
.btn-save:hover:not(:disabled){background:#0a6350}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.modal-ok{padding:10px 14px;background:var(--verde-l);border-radius:8px;font-size:12px;color:var(--verde-d);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.modal-err{padding:8px 12px;background:var(--rosso-l);border-radius:8px;font-size:12px;color:var(--rosso);margin-bottom:10px}

/* Leaflet overrides */
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 4px 20px rgba(0,0,0,.12)!important;border:1px solid var(--border)!important;padding:0!important}
.leaflet-popup-content{margin:0!important;width:auto!important;min-width:170px}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)!important}
.leaflet-control-zoom a{color:var(--t1)!important}

/* Empty state */
.empty{padding:40px 20px;text-align:center;color:var(--t3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-msg{font-size:13px}

/* Spinner */
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#2C2C2A;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;z-index:9999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<nav>
  <div class="logo">Italy<span>Spots</span></div>
  <div class="tabs">
    <button class="tab active" onclick="showView('map')">🗺 Mappa</button>
    <button class="tab" onclick="showView('list')">⊞ Lista</button>
    <button class="tab" onclick="showView('dash')">📊 Stats</button>
  </div>
  <div class="nav-right">
    <button class="btn-add" onclick="openModal()">＋ Aggiungi</button>
  </div>
</nav>

<!-- MAP VIEW -->
<div class="view active" id="map-view">
  <div class="sidebar">
    <div class="sidebar-top">
      <input class="search-box" id="searchInput" placeholder="Cerca nome, città, regione..." oninput="renderAll()">
      <div class="chips">
        <button class="chip on" data-f="all" onclick="setFilter('all',this)">Tutti</button>
        <button class="chip" data-f="todo" onclick="setFilter('todo',this)">Da provare</button>
        <button class="chip" data-f="done" onclick="setFilter('done',this)">Già provati</button>
      </div>
    </div>
    <div class="sidebar-count" id="sideCount">0 luoghi</div>
    <div class="place-list" id="placeList"></div>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-legend">
      <div class="leg-row"><span class="dot dot-todo"></span><span>Da provare</span></div>
      <div class="leg-row"><span class="dot dot-done"></span><span>Già provato</span></div>
    </div>
    <div class="detail" id="detailPanel">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<!-- LIST VIEW -->
<div class="view" id="list-view">
  <div class="list-head">
    <span class="list-title">I miei luoghi</span>
    <select class="fselect" id="lcatF" onchange="renderList()">
      <option value="">Tutte le categorie</option>
      <option>Ristorante</option><option>Bar</option><option>Pasticceria</option>
      <option>Hotel</option><option>Spiaggia</option><option>Attività</option><option>Negozio</option><option>Altro</option>
    </select>
    <select class="fselect" id="lstatF" onchange="renderList()">
      <option value="">Tutti gli stati</option>
      <option value="todo">Da provare</option>
      <option value="done">Già provati</option>
    </select>
    <select class="fselect" id="lregF" onchange="renderList()">
      <option value="">Tutte le regioni</option>
    </select>
    <select class="fselect" id="lsortF" onchange="renderList()">
      <option value="date">Più recenti</option>
      <option value="name">A–Z</option>
      <option value="stars">Stelle ↓</option>
    </select>
  </div>
  <div class="list-grid" id="listGrid"></div>
</div>

<!-- DASHBOARD VIEW -->
<div class="view" id="dash-view">
  <div class="dash-inner">
    <div class="dash-title">Le mie statistiche</div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="prog-bar" id="progBar"></div>
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">Per categoria</div><div id="catBars"></div></div>
      <div class="chart-card"><div class="chart-title">Per regione</div><div id="regBars"></div></div>
    </div>
    <div id="topSection"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Aggiungi un luogo</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="mtabs">
        <button class="mtab on" id="tabUrl" onclick="switchTab('url')">🔗 Da Google Maps</button>
        <button class="mtab" id="tabMan" onclick="switchTab('manual')">✏️ Manuale</button>
      </div>

      <!-- URL tab -->
      <div id="urlTab">
        <div class="fg">
          <label class="flabel">Link Google Maps o nome del posto</label>
          <textarea class="finput" id="gmUrl" rows="3" placeholder="Incolla il link da Google Maps&#10;oppure scrivi direttamente il nome&#10;es: Osteria Francescana Modena"></textarea>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Funziona con qualsiasi link Google Maps o nome di posto</div>
        </div>
        <div id="parseErr"></div>
        <button class="btn-parse" id="parseBtn" onclick="parseUrl()">
          <span id="parseBtnTxt">🔍 Cerca luogo</span>
        </button>
        <div id="parseResult"></div>
      </div>

      <!-- Manual / confirm form -->
      <div id="formTab" style="display:none">
        <div id="formOk"></div>
        <div class="fg">
          <label class="flabel">Nome del posto *</label>
          <input class="finput" id="fName" placeholder="Es. Trattoria da Mario">
        </div>
        <div class="fgrid">
          <div class="fg">
            <label class="flabel">Città *</label>
            <input class="finput" id="fCity" placeholder="Roma">
          </div>
          <div class="fg">
            <label class="flabel">Regione</label>
            <input class="finput" id="fRegion" placeholder="Lazio">
          </div>
        </div>
        <div class="fg">
          <label class="flabel">Indirizzo</label>
          <input class="finput" id="fAddr" placeholder="Via Roma 1">
        </div>
        <div class="fgrid">
          <div class="fg">
            <label class="flabel">Categoria</label>
            <select class="finput" id="fCat">
              <option>Ristorante</option><option>Bar</option><option>Pasticceria</option>
              <option>Hotel</option><option>Spiaggia</option><option>Attività</option>
              <option>Negozio</option><option>Altro</option>
            </select>
          </div>
          <div class="fg">
            <label class="flabel">Stato</label>
            <select class="finput" id="fStatus">
              <option value="todo">Da provare</option>
              <option value="done">Già provato</option>
            </select>
          </div>
        </div>
        <div class="fgrid" id="doneFields" style="display:none">
          <div class="fg">
            <label class="flabel">Valutazione</label>
            <select class="finput" id="fStars">
              <option value="0">—</option>
              <option value="1">★</option><option value="2">★★</option>
              <option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option>
            </select>
          </div>
          <div class="fg">
            <label class="flabel">Data visita</label>
            <input class="finput" type="date" id="fVisit">
          </div>
        </div>
        <div class="fg">
          <label class="flabel">Note personali</label>
          <textarea class="finput" id="fNote" rows="2" placeholder="Impressioni, consigli..."></textarea>
        </div>
        <div id="coordInfo" style="font-size:11px;color:var(--t3);margin-bottom:8px"></div>
        <div id="saveErr"></div>
        <div style="display:flex;gap:8px">
          <button id="backBtn" style="display:none;padding:9px 14px;border-radius:10px;font-size:12px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif" onclick="backToUrl()">← Indietro</button>
          <button class="btn-save" id="saveBtn" onclick="savePlace()">💾 Salva luogo</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── DATA ────────────────────────────────────────────────────
const STORAGE_KEY = 'italyspots_v2';
const CATS = ['Ristorante','Bar','Pasticceria','Hotel','Spiaggia','Attività','Negozio','Altro'];
const CAT_ICONS = {Ristorante:'🍽️',Bar:'☕',Pasticceria:'🥐',Hotel:'🏨',Spiaggia:'🏖️',Attività:'🎯',Negozio:'🛍️',Altro:'📍'};
const SAMPLE = [
  {id:'s1',name:'Osteria Francescana',address:'Via Stella 22',city:'Modena',region:'Emilia-Romagna',category:'Ristorante',status:'done',stars:5,note:'Tre stelle Michelin, esperienza indimenticabile',google_maps_url:'',lat:44.647,lng:10.925,created_at:'2024-01-15',visit_date:'2024-01-15'},
  {id:'s2',name:'Caffè Florian',address:'Piazza San Marco 57',city:'Venezia',region:'Veneto',category:'Bar',status:'done',stars:4,note:'Storico, atmosfera magica',google_maps_url:'',lat:45.434,lng:12.338,created_at:'2024-02-10',visit_date:'2024-02-10'},
  {id:'s3',name:'Da Enzo al 29',address:'Via dei Vascellari 29',city:'Roma',region:'Lazio',category:'Ristorante',status:'todo',stars:0,note:'Consigliato da un amico, coda da aspettare',google_maps_url:'',lat:41.889,lng:12.474,created_at:'2024-03-01',visit_date:null},
  {id:'s4',name:'Gelateria Grom',address:'Via Accademia Albertina 4',city:'Torino',region:'Piemonte',category:'Pasticceria',status:'todo',stars:0,note:'Gelato artigianale famoso',google_maps_url:'',lat:45.066,lng:7.683,created_at:'2024-03-15',visit_date:null},
  {id:'s5',name:'Spiaggia di Positano',address:'Via della Spiaggia',city:'Positano',region:'Campania',category:'Spiaggia',status:'done',stars:5,note:'Vista spettacolare, mare cristallino',google_maps_url:'',lat:40.628,lng:14.484,created_at:'2024-04-01',visit_date:'2024-07-20'},
  {id:'s6',name:'Caffè Sicilia',address:'Corso Vittorio Emanuele 125',city:'Noto',region:'Sicilia',category:'Pasticceria',status:'done',stars:5,note:'Granita di mandorla da sogno, cannoli eccellenti',google_maps_url:'',lat:36.889,lng:15.069,created_at:'2024-05-01',visit_date:'2024-08-10'},
  {id:'s7',name:'Palazzo Strozzi',address:'Piazza Strozzi',city:'Firenze',region:'Toscana',category:'Attività',status:'todo',stars:0,note:'Mostra temporanea da non perdere',google_maps_url:'',lat:43.771,lng:11.251,created_at:'2024-04-20',visit_date:null},
  {id:'s8',name:'Su Gologone',address:'Loc. Su Gologone',city:'Oliena',region:'Sardegna',category:'Hotel',status:'todo',stars:0,note:'Resort immerso nella natura sarda',google_maps_url:'',lat:40.262,lng:9.394,created_at:'2024-05-15',visit_date:null},
];

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.length > 0) return d;
    }
  }catch(e){}
  return SAMPLE.map(s=>({...s}));
}
function save(places){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(places))}catch(e){} }

let places = load();
let currentFilter = 'all';
let selectedId = null;
let editingNoteId = null;
let map = null;
let markers = {};
let currentTab = 'url';
let parsedCoords = null;
let confirmed = false;

// ─── UTILS ───────────────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2) }
function today(){ return new Date().toISOString().slice(0,10) }
function fmtDate(d){ if(!d)return''; try{return new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d} }
function starsStr(n){ return n?'★'.repeat(n)+'☆'.repeat(5-n):'—' }

function getFiltered(){
  const q = (document.getElementById('searchInput')||{}).value||'';
  return places.filter(p=>{
    if(currentFilter==='todo'&&p.status!=='todo')return false;
    if(currentFilter==='done'&&p.status!=='done')return false;
    if(q){const ql=q.toLowerCase();if(!p.name.toLowerCase().includes(ql)&&!p.city.toLowerCase().includes(ql)&&!(p.region||'').toLowerCase().includes(ql))return false}
    return true;
  });
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── MAP ─────────────────────────────────────────────────────
function initMap(){
  map = L.map('map',{center:[42.5,12.5],zoom:6,zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
  }).addTo(map);
}

function makePin(p, selected){
  const col = p.status==='done'?'#1D9E75':'#D85A30';
  const em = CAT_ICONS[p.category]||'📍';
  const sz = selected?44:36;
  const pulse = selected?`<circle cx="22" cy="22" r="${selected?21:18}" fill="${col}" opacity=".18"/>`:''
  const svg=`<svg width="${sz}" height="${sz+10}" viewBox="0 0 44 54" xmlns="http://www.w3.org/2000/svg">
    ${pulse}
    <circle cx="22" cy="20" r="18" fill="${col}" filter="drop-shadow(0 2px 5px rgba(0,0,0,.3))"/>
    <circle cx="22" cy="20" r="15" fill="rgba(255,255,255,.2)"/>
    <text x="22" y="26" text-anchor="middle" font-size="14">${em}</text>
    <path d="M22 40 L16 28 Q22 33 28 28Z" fill="${col}"/>
  </svg>`;
  return L.divIcon({html:svg,className:'',iconSize:[sz,sz+10],iconAnchor:[sz/2,sz+10]});
}

function popupHtml(p){
  const sc=p.status==='done'?'var(--verde-d)':'var(--rosso)';
  const sb=p.status==='done'?'var(--verde-l)':'var(--rosso-l)';
  const sl=p.status==='done'?'✓ Già provato':'● Da provare';
  return`<div style="padding:11px 14px;font-family:'DM Sans',sans-serif">
    <div style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:var(--oro);margin-bottom:3px">${p.category}</div>
    <div style="font-size:13px;font-weight:500;font-family:'Playfair Display',serif;line-height:1.3;margin-bottom:2px">${p.name}</div>
    <div style="font-size:11px;color:var(--t2);margin-bottom:6px">${p.city}${p.region?', '+p.region:''}</div>
    ${p.stars?`<div style="font-size:12px;color:var(--oro);margin-bottom:5px">${'★'.repeat(p.stars)}</div>`:''}
    <span style="font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;background:${sb};color:${sc}">${sl}</span>
  </div>`;
}

function renderMap(){
  if(!map) return;
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers={};
  const fil=getFiltered();
  fil.forEach(p=>{
    if(!p.lat||!p.lng)return;
    const sel=selectedId===p.id;
    const m=L.marker([p.lat,p.lng],{icon:makePin(p,sel),zIndexOffset:sel?1000:0});
    m.bindPopup(popupHtml(p),{maxWidth:230,closeButton:false,autoPan:true});
    m.on('click',()=>{ selectedId=p.id; renderAll(); });
    if(sel) setTimeout(()=>m.openPopup(),50);
    m.addTo(map);
    markers[p.id]=m;
  });
  document.getElementById('sideCount').textContent=fil.length+' luog'+(fil.length===1?'o':'hi');
}

// ─── SIDEBAR LIST ─────────────────────────────────────────────
function renderSidebar(){
  const fil=getFiltered();
  const el=document.getElementById('placeList');
  if(!fil.length){el.innerHTML='<div class="empty"><div class="empty-icon">🗺️</div><div class="empty-msg">Nessun luogo trovato</div></div>';return}
  el.innerHTML=fil.map(p=>`
    <div class="pitem${selectedId===p.id?' sel':''}" onclick="selectPlace('${p.id}')">
      <div class="pitem-name">${p.name}</div>
      <div class="pitem-meta">
        <span class="dot dot-${p.status}"></span>
        ${p.city}
        <span class="ccat">${p.category}</span>
        ${p.stars?`<span style="color:var(--oro);font-size:10px">${'★'.repeat(p.stars)}</span>`:''}
      </div>
    </div>`).join('');
}

function selectPlace(id){
  selectedId=id;
  renderAll();
  const p=places.find(x=>x.id===id);
  if(!p) return;
  if(p.lat&&p.lng&&map){
    map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),13),{animate:true,duration:.7});
    setTimeout(()=>markers[id]?.openPopup(),800);
  }
}

// ─── DETAIL PANEL ─────────────────────────────────────────────
function renderDetail(){
  const panel=document.getElementById('detailPanel');
  if(!selectedId){panel.classList.remove('open');return}
  const p=places.find(x=>x.id===selectedId);
  if(!p){panel.classList.remove('open');return}

  const starsHtml=`<div class="stars-row">
    ${[1,2,3,4,5].map(n=>`<span class="star${n<=p.stars?' on':''}" onclick="setStar('${p.id}',${n})" title="${n} stelle">★</span>`).join('')}
  </div>`;

  const noteHtml=editingNoteId===p.id
    ?`<textarea class="note-edit" id="noteEdit" rows="3">${p.note||''}</textarea>
       <div class="mini-btns" style="margin-top:4px">
         <button class="btn-mini pri" onclick="saveNote('${p.id}')">Salva</button>
         <button class="btn-mini sec" onclick="cancelNote()">Annulla</button>
       </div>`
    :`<div class="note-box${!p.note?' empty':''}" onclick="startEditNote('${p.id}')" title="Clicca per modificare">
        ${p.note||'Aggiungi una nota...'}
      </div>`;

  document.getElementById('detailContent').innerHTML=`
    <div class="detail-head">
      <div class="detail-cat">${CAT_ICONS[p.category]||''} ${p.category}</div>
      <div class="detail-name">${p.name}</div>
      <div class="detail-addr">${[p.address,p.city,p.region].filter(Boolean).join(', ')}</div>
    </div>
    <div class="detail-body">
      <div>
        <span class="badge badge-${p.status}">${p.status==='done'?'✓ Già provato':'● Da provare'}</span>
        ${p.visit_date?`<span style="font-size:11px;color:var(--t3);margin-left:8px">${fmtDate(p.visit_date)}</span>`:''}
      </div>
      <div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:5px">Valutazione</div>
        ${starsHtml}
      </div>
      <div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:4px">Note personali <span style="font-size:10px">(clicca per modificare)</span></div>
        ${noteHtml}
      </div>
      <div style="font-size:11px;color:var(--t3)">Aggiunto il ${fmtDate(p.created_at)}</div>
    </div>
    <div class="detail-foot">
      ${p.status==='todo'?`<button class="btn-action btn-done-action" onclick="markDone('${p.id}')">✓ Segna come provato</button>`:''}
      ${p.google_maps_url?`<a class="btn-action" href="${p.google_maps_url}" target="_blank" rel="noopener">↗ Apri in Google Maps</a>`:''}
      <button class="btn-action btn-del" onclick="delPlace('${p.id}')">🗑 Elimina luogo</button>
    </div>`;
  panel.classList.add('open');
}

function closeDetail(){selectedId=null;renderAll()}

function setStar(id,n){
  const p=places.find(x=>x.id===id);
  if(!p)return;
  p.stars = p.stars===n?0:n;
  save(places);renderAll();
}

function startEditNote(id){editingNoteId=id;renderDetail()}
function cancelNote(){editingNoteId=null;renderDetail()}
function saveNote(id){
  const p=places.find(x=>x.id===id);
  if(!p)return;
  const v=document.getElementById('noteEdit')?.value||'';
  p.note=v;editingNoteId=null;save(places);renderAll();showToast('Nota salvata');
}

function markDone(id){
  const p=places.find(x=>x.id===id);
  if(!p)return;
  p.status='done';p.visit_date=today();save(places);renderAll();showToast('✓ Segnato come provato!');
}

function delPlace(id){
  const p=places.find(x=>x.id===id);
  if(!p||!confirm('Eliminare "'+p.name+'"?'))return;
  places=places.filter(x=>x.id!==id);selectedId=null;save(places);renderAll();showToast('Luogo eliminato');
}

// ─── LIST VIEW ────────────────────────────────────────────────
function renderList(){
  const catF=document.getElementById('lcatF')?.value||'';
  const statF=document.getElementById('lstatF')?.value||'';
  const regF=document.getElementById('lregF')?.value||'';
  const srt=document.getElementById('lsortF')?.value||'date';
  let filtered=[...places];
  if(catF)filtered=filtered.filter(p=>p.category===catF);
  if(statF)filtered=filtered.filter(p=>p.status===statF);
  if(regF)filtered=filtered.filter(p=>p.region===regF);
  if(srt==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(srt==='stars')filtered.sort((a,b)=>b.stars-a.stars);
  else filtered.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  // Populate region filter
  const regions=[...new Set(places.map(p=>p.region).filter(Boolean))].sort();
  const rf=document.getElementById('lregF');
  if(rf){
    const cur=rf.value;
    rf.innerHTML='<option value="">Tutte le regioni</option>'+regions.map(r=>`<option${r===cur?' selected':''}>${r}</option>`).join('');
  }

  const grid=document.getElementById('listGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🗺️</div><div class="empty-msg">Nessun luogo trovato</div></div>';return}
  grid.innerHTML=filtered.map(p=>`
    <div class="pcard" onclick="goToPlace('${p.id}')">
      <div class="pcard-cat">${CAT_ICONS[p.category]||''} ${p.category}</div>
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-city">${p.city}${p.region?', '+p.region:''}</div>
      <div class="pcard-foot">
        <span class="badge badge-${p.status}">${p.status==='done'?'Provato':'Da provare'}</span>
        ${p.stars?`<span class="pcard-stars">${'★'.repeat(p.stars)}</span>`:''}
      </div>
      ${p.note?`<div class="pcard-note">"${p.note}"</div>`:''}
      <div class="pcard-actions">
        ${p.google_maps_url?`<a class="icon-btn" href="${p.google_maps_url}" target="_blank" rel="noopener" title="Google Maps" onclick="event.stopPropagation()">↗</a>`:''}
        ${p.status==='todo'?`<button class="icon-btn" title="Segna come provato" onclick="event.stopPropagation();markDoneList('${p.id}')" style="color:var(--verde-d)">✓</button>`:''}
        <button class="icon-btn" title="Elimina" onclick="event.stopPropagation();delPlace('${p.id}')" style="color:var(--rosso)">🗑</button>
      </div>
    </div>`).join('');
}

function markDoneList(id){
  const p=places.find(x=>x.id===id);
  if(!p)return;
  p.status='done';p.visit_date=today();save(places);renderAll();showToast('✓ Segnato come provato!');
}

function goToPlace(id){
  selectedId=id;
  showView('map');
  setTimeout(()=>selectPlace(id),100);
}

// ─── DASHBOARD ────────────────────────────────────────────────
function renderDash(){
  const done=places.filter(p=>p.status==='done').length;
  const todo=places.filter(p=>p.status==='todo').length;
  const rated=places.filter(p=>p.stars>0);
  const avg=rated.length?(rated.reduce((s,p)=>s+p.stars,0)/rated.length).toFixed(1):0;
  const pct=places.length?Math.round(done/places.length*100):0;

  document.getElementById('statsGrid').innerHTML=`
    <div class="scard" style="background:var(--verde-l)"><div class="scard-n" style="color:var(--verde-d)">${places.length}</div><div class="scard-l" style="color:var(--verde-d)">Totale luoghi</div></div>
    <div class="scard" style="background:var(--rosso-l)"><div class="scard-n" style="color:var(--rosso)">${todo}</div><div class="scard-l" style="color:var(--rosso)">Da provare</div></div>
    <div class="scard" style="background:var(--verde-l)"><div class="scard-n" style="color:var(--verde-d)">${done}</div><div class="scard-l" style="color:var(--verde-d)">Già provati</div></div>
    <div class="scard" style="background:var(--oro-l)"><div class="scard-n" style="color:var(--oro)">${avg>0?avg+'★':'—'}</div><div class="scard-l" style="color:var(--oro)">Media stelle</div></div>`;

  document.getElementById('progBar').innerHTML=places.length?`
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:6px">
      <span>Progressi</span><span style="font-weight:500">${pct}% completati</span>
    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-labels">
      <span style="color:var(--verde-d)">${done} provati</span>
      <span style="color:var(--rosso)">${todo} da provare</span>
    </div>`:'';

  // Categories
  const cats={};places.forEach(p=>{cats[p.category]=(cats[p.category]||0)+1});
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxC=topCats[0]?.[1]||1;
  document.getElementById('catBars').innerHTML=topCats.map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-label">${CAT_ICONS[k]||''} ${k}</div>
      <div class="bar-track"><div class="bar-fill cat" style="width:${Math.round(v/maxC*100)}%"></div></div>
      <div class="bar-n">${v}</div>
    </div>`).join('');

  // Regions
  const regs={};places.forEach(p=>{if(p.region)regs[p.region]=(regs[p.region]||0)+1});
  const topRegs=Object.entries(regs).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxR=topRegs[0]?.[1]||1;
  document.getElementById('regBars').innerHTML=topRegs.map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-label" style="font-size:10px">${k}</div>
      <div class="bar-track"><div class="bar-fill reg" style="width:${Math.round(v/maxR*100)}%"></div></div>
      <div class="bar-n">${v}</div>
    </div>`).join('');

  // Top rated
  const top=[...places].filter(p=>p.stars>0).sort((a,b)=>b.stars-a.stars).slice(0,5);
  document.getElementById('topSection').innerHTML=top.length?`
    <div class="top-card">
      <div class="chart-title" style="margin-bottom:10px">I miei migliori ⭐</div>
      ${top.map((p,i)=>`
        <div class="top-row" onclick="goToPlace('${p.id}')" style="cursor:pointer">
          <span class="top-n">${i+1}</span>
          <span style="font-size:14px">${CAT_ICONS[p.category]||''}</span>
          <div class="top-info">
            <div class="top-name">${p.name}</div>
            <div class="top-city">${p.city}${p.region?', '+p.region:''}</div>
          </div>
          <span class="top-stars">${'★'.repeat(p.stars)}</span>
        </div>`).join('')}
    </div>`:'';
}

// ─── VIEWS ───────────────────────────────────────────────────
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  document.querySelectorAll('.tab').forEach(el=>{if(el.textContent.toLowerCase().includes(v==='map'?'mappa':v==='list'?'lista':'stat'))el.classList.add('active')});
  if(v==='dash')renderDash();
  if(v==='map')setTimeout(()=>map&&map.invalidateSize(),50);
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  renderAll();
}

function renderAll(){
  renderMap();
  renderSidebar();
  renderDetail();
  renderList();
}

// ─── MODAL ───────────────────────────────────────────────────
function openModal(){
  document.getElementById('addOverlay').classList.add('open');
  resetModal();
}
function closeModal(){document.getElementById('addOverlay').classList.remove('open')}
function resetModal(){
  document.getElementById('gmUrl').value='';
  document.getElementById('parseErr').innerHTML='';
  document.getElementById('parseResult').innerHTML='';
  document.getElementById('formOk').innerHTML='';
  document.getElementById('saveErr').innerHTML='';
  document.getElementById('fName').value='';document.getElementById('fCity').value='';
  document.getElementById('fRegion').value='';document.getElementById('fAddr').value='';
  document.getElementById('fNote').value='';document.getElementById('fStars').value='0';
  document.getElementById('fStatus').value='todo';document.getElementById('fVisit').value='';
  document.getElementById('coordInfo').innerHTML='';
  document.getElementById('doneFields').style.display='none';
  document.getElementById('backBtn').style.display='none';
  parsedCoords=null;confirmed=false;
  switchTab('url');
}

function switchTab(t){
  currentTab=t;
  document.getElementById('tabUrl').classList.toggle('on',t==='url');
  document.getElementById('tabMan').classList.toggle('on',t==='manual');
  document.getElementById('urlTab').style.display=t==='url'?'block':'none';
  document.getElementById('formTab').style.display=t==='manual'||confirmed?'block':'none';
  if(t==='manual'){document.getElementById('backBtn').style.display='none';document.getElementById('formOk').innerHTML=''}
}

document.getElementById('fStatus').addEventListener('change',function(){
  document.getElementById('doneFields').style.display=this.value==='done'?'grid':'none';
});

async function parseUrl(){
  const url=document.getElementById('gmUrl').value.trim();
  if(!url){document.getElementById('parseErr').innerHTML='<div class="modal-err">Inserisci un link o un nome.</div>';return}
  const btn=document.getElementById('parseBtn');const btxt=document.getElementById('parseBtnTxt');
  btn.disabled=true;btxt.innerHTML='<span class="spin">⏳</span> Ricerca in corso...';
  document.getElementById('parseErr').innerHTML='';document.getElementById('parseResult').innerHTML='';

  let lat=null,lng=null,name='',city='',region='',address='';

  // 1. Extract coords from URL
  const atM=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(atM){lat=parseFloat(atM[1]);lng=parseFloat(atM[2])}
  const qM=url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(qM&&!lat){lat=parseFloat(qM[1]);lng=parseFloat(qM[2])}

  // 2. Extract name from URL or use as query
  let query='';
  const placeM=url.match(/\/place\/([^/@?&]+)/);
  if(placeM)query=decodeURIComponent(placeM[1].replace(/\+/g,' '));
  else if(!url.startsWith('http'))query=url;

  // 3. Geocode via Nominatim
  if(query||(!lat&&url)){
    const q=query||url;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Italy')}&format=json&limit=1&addressdetails=1&countrycodes=it`,
        {headers:{'Accept-Language':'it','User-Agent':'ItalySpots/1.0'}});
      const d=await r.json();
      if(d[0]){
        if(!lat){lat=parseFloat(d[0].lat);lng=parseFloat(d[0].lon)}
        const a=d[0].address||{};
        name=d[0].name||q;
        city=a.city||a.town||a.village||a.municipality||'';
        region=a.state||'';
        address=(a.road||'')+(a.house_number?' '+a.house_number:'');
      }
    }catch(e){}
  }

  btn.disabled=false;btxt.textContent='🔍 Cerca luogo';

  if(!lat||!lng){
    document.getElementById('parseErr').innerHTML='<div class="modal-err">Luogo non trovato. Inserisci il nome del posto manualmente.</div>';
    return;
  }

  parsedCoords={lat,lng};
  document.getElementById('parseResult').innerHTML=`
    <div class="modal-ok">✅ Luogo trovato: <strong>${name||'Coordinate trovate'}</strong>${city?', '+city:''}</div>
    <button class="btn-parse" onclick="confirmUrl()">Continua → Compila i dettagli</button>`;
  // Pre-fill form
  if(name)document.getElementById('fName').value=name;
  if(city)document.getElementById('fCity').value=city;
  if(region)document.getElementById('fRegion').value=region;
  if(address)document.getElementById('fAddr').value=address;
  document.getElementById('coordInfo').innerHTML=`📍 Coordinate: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
}

function confirmUrl(){
  confirmed=true;
  document.getElementById('urlTab').style.display='none';
  document.getElementById('formTab').style.display='block';
  document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('formOk').innerHTML='<div class="modal-ok" style="margin-bottom:12px">✅ Posizione trovata! Completa i dettagli e salva.</div>';
}

function backToUrl(){
  confirmed=false;
  document.getElementById('urlTab').style.display='block';
  document.getElementById('formTab').style.display='none';
}

function savePlace(){
  const name=document.getElementById('fName').value.trim();
  const city=document.getElementById('fCity').value.trim();
  if(!name||!city){document.getElementById('saveErr').innerHTML='<div class="modal-err">Nome e città sono obbligatori.</div>';return}
  const status=document.getElementById('fStatus').value;
  const place={
    id:uid(),name,city,
    region:document.getElementById('fRegion').value.trim(),
    address:document.getElementById('fAddr').value.trim(),
    category:document.getElementById('fCat').value,
    status,
    stars:parseInt(document.getElementById('fStars').value)||0,
    note:document.getElementById('fNote').value.trim(),
    google_maps_url:document.getElementById('gmUrl')?.value.trim()||'',
    lat:parsedCoords?parsedCoords.lat:null,
    lng:parsedCoords?parsedCoords.lng:null,
    visit_date:status==='done'?(document.getElementById('fVisit').value||today()):null,
    created_at:today()
  };
  places.unshift(place);save(places);
  closeModal();renderAll();
  showToast('✅ '+name+' aggiunto!');
  // Fly to if has coords
  if(place.lat&&place.lng&&map){
    selectedId=place.id;
    showView('map');
    setTimeout(()=>selectPlace(place.id),300);
  }
}

// ─── INIT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  initMap();
  renderAll();
  document.getElementById('addOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('addOverlay'))closeModal()});
});
</script>
