<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#085041">
<title>Spots</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#1D9E75;--gl:#E1F5EE;--gd:#085041;
  --r:#D85A30;--rl:#FAECE7;
  --o:#BA7517;--ol:#FAEEDA;
  --bg:#f7f5f0;--w:#fff;
  --t1:#2C2C2A;--t2:#78716c;--t3:#a8a29e;
  --bdr:rgba(0,0,0,0.08);
  --nav:52px;--sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1)}

/* AUTH */
.auth-screen{position:fixed;inset:0;z-index:2000;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.auth-logo{font-family:'Playfair Display',serif;font-size:32px;color:#fff;margin-bottom:6px;text-align:center}
.auth-logo span{color:#f4a572}
.auth-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;text-align:center}
.auth-card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:340px}
.auth-tabs{display:flex;gap:2px;background:#f0ede8;border-radius:10px;padding:3px;margin-bottom:16px}
.auth-tab{flex:1;padding:7px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .2s}
.auth-tab.on{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.auth-field{margin-bottom:12px}
.auth-label{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.auth-input{width:100%;padding:12px 13px;border:1.5px solid var(--bdr);border-radius:11px;font-size:15px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none;-webkit-appearance:none}
.auth-input:focus{border-color:var(--g);background:#fff}
.auth-btn{width:100%;padding:13px;background:var(--gd);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:opacity .15s}
.auth-btn:active{opacity:.8}
.auth-btn:disabled{opacity:.4;cursor:not-allowed}
.msg-err{background:var(--rl);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--r);margin-bottom:10px;line-height:1.5}
.msg-ok{background:var(--gl);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--gd);margin-bottom:10px;line-height:1.5}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--gd);z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-logo{font-family:'Playfair Display',serif;font-size:28px;color:#fff}
.loading-logo span{color:#f4a572}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-msg{font-size:13px;color:rgba(255,255,255,.6)}
@keyframes spin{to{transform:rotate(360deg)}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav);background:var(--gd);
  display:flex;align-items:center;padding:0 10px;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.logo{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer;flex-shrink:0}
.logo span{color:#f4a572}
.nav-tabs{display:flex;gap:2px;flex:1;justify-content:center}
.ntab{padding:5px 10px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:none;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap}
.ntab.on{background:rgba(255,255,255,.25);color:#fff}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0}
.sync-dot.off{background:#f87171}
.sync-dot.syncing{background:#fbbf24;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-add{height:30px;padding:0 12px;border-radius:15px;background:var(--r);border:none;cursor:pointer;
  color:#fff;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(216,90,48,.4);transition:opacity .15s;flex-shrink:0}
.btn-add:active{opacity:.8}
.avatar-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);border:none;
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* VIEWS */
.view{position:fixed;top:var(--nav);left:0;right:0;bottom:0;display:none;overflow:hidden}
.view.on{display:block}
#mapView{background:#e8ede8}
#map{width:100%;height:100%}

/* DISCOVER BANNER */
.disc-banner{position:absolute;top:0;left:0;right:0;z-index:200;padding:8px 12px;
  background:rgba(8,80,65,.9);backdrop-filter:blur(8px);display:none;align-items:center;gap:8px}
.disc-banner.on{display:flex}
.disc-info{flex:1;min-width:0}
.disc-name{font-size:13px;font-weight:500;color:#fff}
.disc-sub{font-size:11px;color:rgba(255,255,255,.6)}
.disc-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;
  border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* BOTTOM SHEET */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:300;background:var(--w);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);
  will-change:transform;display:flex;flex-direction:column}
.handle-bar{width:36px;height:4px;background:#ddd;border-radius:2px}
.sheet-drag{padding:10px 0 4px;display:flex;justify-content:center;cursor:grab;flex-shrink:0;user-select:none}
.sheet-header{padding:0 14px 0;flex-shrink:0}
.sheet-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-title{font-family:'Playfair Display',serif;font-size:15px}
.sheet-count{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:20px}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:9px 34px;border:1.5px solid var(--bdr);border-radius:12px;
  font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;color:var(--t1)}
.search-wrap input:focus{border-color:var(--g);background:#fff}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;color:var(--t3)}
.clr-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--t3);padding:2px;display:none}
.stabs{display:flex;border-bottom:1px solid var(--bdr)}
.stab{flex:1;padding:7px 4px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;
  border:none;border-bottom:2px solid transparent;color:var(--t3);background:none;
  font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:-1px}
.stab.on{color:var(--gd);border-bottom-color:var(--gd)}
.sheet-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:var(--sab)}
.sec-head{padding:8px 14px 4px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;color:var(--t3);background:var(--bg);border-top:1px solid var(--bdr);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #fafaf8;cursor:pointer;transition:background .1s}
.pitem:active{background:#f5f5f3}
.pitem.sel{background:var(--gl)}
.pitem-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.pitem-icon.todo{background:var(--rl)}
.pitem-icon.done{background:var(--gl)}
.pitem-icon.other{background:#f0ede8}
.pitem-body{flex:1;min-width:0}
.pitem-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.pitem-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px}
.pitem-stars{color:var(--o);font-size:10px}
.ibtns{display:flex;gap:5px;flex-shrink:0}
.ibtn{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.ibtn:active{opacity:.7}
.ibtn-check{background:var(--gl);color:var(--gd)}
.ibtn-del{background:var(--rl);color:var(--r)}
.ibtn-save{background:var(--ol);color:var(--o)}
.empty-state{padding:36px 20px;text-align:center;color:var(--t3)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-msg{font-size:13px}

/* DIM + DRAWER */
.dim{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:350;display:none;transition:background .3s}
.dim.on{display:block;background:rgba(0,0,0,.4)}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:400;background:var(--w);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:88vh;display:flex;flex-direction:column}
.drawer.open{transform:translateY(0)}
.dhandle{padding:10px 0 2px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.dhead{padding:2px 16px 12px;flex-shrink:0}
.dcat{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--o);margin-bottom:3px}
.dname{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;line-height:1.25;margin-bottom:3px}
.daddr{font-size:12px;color:var(--t2);margin-bottom:6px}
.downer{font-size:11px;color:var(--t3);margin-bottom:8px}
.dbadges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;display:inline-block}
.badge-todo{background:var(--rl);color:var(--r)}
.badge-done{background:var(--gl);color:var(--gd)}
.dbody{overflow-y:auto;flex:1;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.slabel{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin:14px 0 6px}
.stars-row{display:flex;gap:4px}
.star{font-size:28px;cursor:pointer;color:#e5e2de;line-height:1;transition:color .1s}
.star.on{color:var(--o)}
.note-display{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.6;color:var(--t1);cursor:pointer;min-height:44px}
.note-display.empty{color:var(--t3);font-style:italic}
.note-hint{font-size:10px;color:var(--t3);margin-top:3px}
.note-area{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:12px;font-size:13px;line-height:1.6;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);resize:none;outline:none;min-height:70px}
.note-area:focus{border-color:var(--g);background:#fff}
.date-field{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:11px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none}
.dfoot{padding:10px 16px;padding-bottom:max(14px,var(--sab));border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.btn-full{width:100%;padding:13px;border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit;transition:opacity .15s}
.btn-full:active{opacity:.8}
.btn-green{background:var(--gl);color:var(--gd)}
.btn-gray{background:var(--bg);color:var(--t1);border:1px solid var(--bdr)!important}
.btn-red{background:var(--rl);color:var(--r)}
.btn-gold{background:var(--ol);color:var(--o)}
.mini-save{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:500;background:var(--gd);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
.mini-cancel{padding:8px 12px;border-radius:10px;font-size:12px;background:var(--bg);color:var(--t2);border:1px solid var(--bdr);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;margin-left:6px}

/* LIST VIEW */
#listView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--sab)}
.list-head{background:var(--w);padding:12px 14px 10px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10}
.list-head-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:10px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;border:1px solid var(--bdr);background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif;flex-shrink:0}
.fchip.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.list-sec{padding:12px 14px 6px;display:flex;align-items:center;gap:8px}
.list-sec-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:500}
.list-sec-count{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:20px}
.list-sec-line{height:2px;margin:0 14px;border-radius:1px}
.line-todo{background:linear-gradient(90deg,var(--r),transparent)}
.line-done{background:linear-gradient(90deg,var(--g),transparent)}
.list-cards{padding:10px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.pcard{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:12px;transition:all .2s;position:relative;overflow:hidden;cursor:pointer}
.pcard:active{transform:scale(.97)}
.pcard-bar{position:absolute;top:0;left:0;right:0;height:3px}
.pcard-bar.todo{background:linear-gradient(90deg,var(--r),#f4a572)}
.pcard-bar.done{background:linear-gradient(90deg,var(--g),#5dcaa5)}
.pcard-ico{font-size:22px;margin-bottom:5px;display:block}
.pcard-cat{font-size:10px;font-weight:500;color:var(--o);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.pcard-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px}
.pcard-city{font-size:11px;color:var(--t2);margin-bottom:7px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.pbtn-sm{width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pbtn-sm:active{opacity:.7}
.pbtn-sm-check{background:var(--gl);color:var(--gd)}
.pbtn-sm-del{background:var(--rl);color:var(--r)}

/* DISCOVER */
#discoverView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--sab)}
.disc-head{background:var(--w);padding:12px 14px 10px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10}
.disc-head-title{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:10px}
.disc-search{position:relative}
.disc-search input{width:100%;padding:9px 34px;border:1.5px solid var(--bdr);border-radius:12px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;color:var(--t1)}
.disc-search input:focus{border-color:var(--g);background:#fff}
.users-grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.user-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px;cursor:pointer;text-align:center;transition:all .2s}
.user-card:active{transform:scale(.97)}
.user-card.me{border-color:var(--g);background:var(--gl)}
.user-avatar{font-size:32px;margin-bottom:8px}
.user-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;margin-bottom:3px}
.user-spots{font-size:11px;color:var(--t3)}

/* DASH */
#dashView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(14px + var(--sab))}
.dash-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:14px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.scard{border-radius:16px;padding:14px;text-align:center}
.scard-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;line-height:1}
.scard-l{font-size:11px;margin-top:3px;opacity:.8}
.prog-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px;margin-bottom:12px}
.prog-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:7px}
.prog-track{height:8px;background:#ede9e3;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gd),var(--g));transition:width .8s}
.prog-sub{display:flex;justify-content:space-between;font-size:11px;margin-top:5px}
.chart-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px;margin-bottom:10px}
.chart-t{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:11px;width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:#ede9e3;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s}
.bar-n{font-size:10px;color:var(--t3);width:16px;text-align:right;flex-shrink:0}
.top-card{background:var(--w);border:1px solid var(--bdr);border-radius:16px;padding:14px}
.top-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fafaf8;cursor:pointer}
.top-row:last-child{border:none}

/* PROFILE DRAWER */
.profile-drawer{position:fixed;bottom:0;left:0;right:0;z-index:600;background:var(--w);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:65vh;display:flex;flex-direction:column}
.profile-drawer.open{transform:translateY(0)}
.prof-handle{padding:10px 0 2px;display:flex;justify-content:center;flex-shrink:0;cursor:pointer}
.prof-body{padding:0 18px 0;flex:1;overflow-y:auto}
.prof-avatar{font-size:40px;text-align:center;margin-bottom:4px}
.prof-name{font-family:'Playfair Display',serif;font-size:20px;text-align:center;margin-bottom:2px}
.prof-username{font-size:13px;color:var(--t3);text-align:center;margin-bottom:14px}
.prof-field{margin-bottom:12px}
.prof-label{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.prof-input{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:11px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none}
.prof-input:focus{border-color:var(--g);background:#fff}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emoji-opt{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--bg);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.emoji-opt.on{border-color:var(--g);background:var(--gl)}
.prof-foot{padding:12px 18px;padding-bottom:max(16px,var(--sab));border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.btn-logout{width:100%;padding:12px;border-radius:13px;background:var(--rl);color:var(--r);border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ADD MODAL */
.modal-ov{position:fixed;inset:0;z-index:700;display:none;align-items:flex-end;background:rgba(0,0,0,0);transition:background .3s}
.modal-ov.open{display:flex;background:rgba(0,0,0,.45)}
.modal{background:var(--w);border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);padding-bottom:max(20px,var(--sab))}
.modal-ov.open .modal{transform:translateY(0)}
.modal-handle{padding:10px 0 2px;display:flex;justify-content:center}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 14px}
.modal-title{font-family:'Playfair Display',serif;font-size:18px}
.modal-x{background:none;border:none;cursor:pointer;font-size:22px;color:var(--t3);padding:0;line-height:1}
.mbody{padding:0 16px}
.mtabs{display:flex;gap:2px;background:#f0ede8;border-radius:12px;padding:3px;margin-bottom:16px}
.mtab{flex:1;padding:7px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.mtab.on{background:#fff;color:var(--t1);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.fg{margin-bottom:11px}
.flbl{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:11px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--g);background:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{width:100%;padding:13px;background:var(--gd);color:#fff;border:none;border-radius:13px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;margin-top:4px}
.pbtn:active{opacity:.8}
.pbtn:disabled{opacity:.4;cursor:not-allowed}

/* TOAST */
.toast{position:fixed;bottom:calc(80px + var(--sab));left:50%;transform:translateX(-50%) translateY(16px);background:#1c1c1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LEAFLET */
.leaflet-popup-content-wrapper{border-radius:14px!important;box-shadow:0 8px 24px rgba(0,0,0,.15)!important;border:none!important;padding:0!important}
.leaflet-popup-content{margin:0!important;width:auto!important}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom{border:none!important;border-radius:12px!important;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)!important}
.leaflet-control-zoom a{color:var(--t1)!important}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
// ─── CONFIG ──────────────────────────────────────────────
const SB_URL = 'https://bruizoplaraqungtxehk.supabase.co';
const SB_KEY = 'sb_publishable_T9OKuMMG6-WKVWUCcYlN3Q_Ml64PC0Q';
const IC = {Ristorante:'🍽️',Bar:'☕',Pasticceria:'🥐',Hotel:'🏨',Spiaggia:'🏖️',Attività:'🎯',Negozio:'🛍️',Altro:'📍'};
const EMOJIS = ['🍕','🌍','⭐','🏔','🌊','🎭','🍷','🌺','🦁','🎸','🏛','🚀'];

// ─── STATE ───────────────────────────────────────────────
let sb = null;
let currentUser = null, currentProfile = null;
let myPlaces = [], viewingPlaces = [], viewingUser = null;
let allProfiles = [];
let selId = null, sheetFilter = 'all', listFilter = 'all';
let editNote = false, geocoded = null, confirmed = false;
let map = null, mapMarkers = {}, mapReady = false;
let snapState = 'peek', sheetDragging = false;
let dragStartY = 0, dragStartTY = 0, curTY = 0;

const today = () => new Date().toISOString().slice(0,10);
const fmtD = d => { if(!d) return ''; try { return new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}); } catch(e) { return d; }};
const isMyMap = () => !viewingUser || viewingUser.id === currentUser?.id;
const activePlaces = () => isMyMap() ? myPlaces : viewingPlaces;
const $ = id => document.getElementById(id);
const show = id => $(id).style.display = 'flex';
const hide = id => $(id).style.display = 'none';
const showBlock = id => $(id).style.display = 'block';

// ─── SUPABASE ────────────────────────────────────────────
function initSupabase() {
  const client = window.supabase;
  if (!client || !client.createClient) {
    console.error('Supabase SDK not loaded');
    return false;
  }
  sb = client.createClient(SB_URL, SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
  return true;
}

async function sbSignIn(username, password) {
  const { data, error } = await sb.auth.signInWithPassword({
    email: username + '@spots.app',
    password
  });
  if (error) throw new Error(error.message);
  return data;
}

async function sbSignUp(username, password) {
  const { data, error } = await sb.auth.signUp({
    email: username + '@spots.app',
    password,
    options: { data: { username } }
  });
  if (error) throw new Error(error.message);
  return data;
}

async function sbSignOut() {
  await sb?.auth.signOut();
}

async function sbGetSession() {
  const { data } = await sb.auth.getSession();
  return data?.session || null;
}

async function dbGetProfile(userId) {
  const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
  return data || null;
}

async function dbUpsertProfile(profile) {
  const { error } = await sb.from('profiles').upsert(profile);
  if (error) throw new Error(error.message);
}

async function dbGetProfiles() {
  const { data, error } = await sb.from('profiles').select('*').order('username');
  if (error) return [];
  return data || [];
}

async function dbGetPlaces(userId) {
  if (!userId) return [];
  const { data, error } = await sb.from('places').select('*').eq('user_id', userId).order('created_at', { ascending: false });
  if (error) return [];
  return (data || []).map(fromDb);
}

async function dbInsertPlace(place) {
  const { data, error } = await sb.from('places').insert(toDb(place)).select().single();
  if (error) throw new Error(error.message);
  return fromDb(data);
}

async function dbUpdatePlace(id, fields) {
  const { error } = await sb.from('places').update(fields).eq('id', id);
  if (error) console.warn('Update failed:', error.message);
}

async function dbDeletePlace(id) {
  const { error } = await sb.from('places').delete().eq('id', id);
  if (error) console.warn('Delete failed:', error.message);
}

function toDb(p) {
  return {
    name: p.name, address: p.address || '', city: p.city,
    region: p.region || '', category: p.category,
    status: p.status, stars: p.stars || 0,
    note: p.note || null, gm_url: p.gmUrl || null,
    lat: p.lat || null, lng: p.lng || null,
    visited: p.visited || null,
    user_id: currentUser?.id || null,
    is_public: true
  };
}

function fromDb(d) {
  return {
    id: d.id,
    name: d.name || '',
    address: d.address || '',
    city: d.city || '',
    region: d.region || '',
    category: d.category || 'Altro',
    status: d.status || 'todo',
    stars: parseInt(d.stars) || 0,
    note: d.note || '',
    gmUrl: d.gm_url || '',
    lat: d.lat ? parseFloat(d.lat) : null,
    lng: d.lng ? parseFloat(d.lng) : null,
    visited: d.visited || null,
    created: (d.created_at || '').slice(0, 10),
    user_id: d.user_id || null
  };
}

// ─── SYNC DOT ────────────────────────────────────────────
function syncDot(s) {
  const d = $('syncDot');
  if (!d) return;
  d.className = 'sync-dot' + (s === 'off' ? ' off' : s === 'syncing' ? ' syncing' : '');
}

// ─── AUTH ────────────────────────────────────────────────
function authTab(t) {
  $('atLogin').classList.toggle('on', t === 'login');
  $('atReg').classList.toggle('on', t === 'register');
  $('loginForm').style.display = t === 'login' ? 'block' : 'none';
  $('regForm').style.display = t === 'register' ? 'block' : 'none';
  $('authMsg').innerHTML = '';
}

function setAuthMsg(msg, type) {
  $('authMsg').innerHTML = '<div class="msg-' + (type === 'err' ? 'err' : 'ok') + '">' + msg + '</div>';
}

async function doLogin() {
  const username = $('lUser').value.trim();
  const password = $('lPass').value;
  if (!username || !password) { setAuthMsg('Inserisci username e password', 'err'); return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'Accesso...';
  setAuthMsg('Accesso in corso...', 'ok');
  try {
    const data = await sbSignIn(username, password);
    // Check if account was deleted
    const { data: prof } = await sb.from('profiles').select('deleted').eq('id', data.user.id).single();
    if (prof?.deleted) {
      await sbSignOut();
      setAuthMsg('Account non trovato', 'err');
      btn.disabled = false; btn.textContent = 'Accedi →';
      return;
    }
    currentUser = { id: data.user.id, email: data.user.email };
    await afterLogin();
  } catch(e) {
    setAuthMsg('Username o password errati', 'err');
    btn.disabled = false; btn.textContent = 'Accedi →';
  }
}

async function doRegister() {
  const username = $('rUser').value.trim();
  const password = $('rPass').value;
  if (!username || !password) { setAuthMsg('Inserisci username e password', 'err'); return; }
  if (username.length < 3) { setAuthMsg('Username minimo 3 caratteri', 'err'); return; }
  if (password.length < 6) { setAuthMsg('Password minimo 6 caratteri', 'err'); return; }

  const btn = $('regBtn');
  btn.disabled = true; btn.textContent = 'Creazione...';
  setAuthMsg('Verifica username...', 'ok');

  // Check if username taken
  try {
    const { data: ex } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
    if (ex) { setAuthMsg('Username già in uso', 'err'); btn.disabled = false; btn.textContent = 'Crea account →'; return; }
  } catch(e) {}

  setAuthMsg('Creazione account...', 'ok');
  try {
    const data = await sbSignUp(username, password);
    if (!data.user) throw new Error('Registrazione fallita');

    // Create profile immediately
    await dbUpsertProfile({ id: data.user.id, username, display_name: username, avatar_emoji: '🍕' });

    if (data.session) {
      currentUser = { id: data.user.id, email: data.user.email };
      await afterLogin();
    } else {
      // Email confirm required
      setAuthMsg('Account creato! Accedi ora.', 'ok');
      authTab('login');
      $('lUser').value = username;
      btn.disabled = false; btn.textContent = 'Crea account →';
    }
  } catch(e) {
    const msg = e.message || '';
    if (msg.includes('already registered') || msg.includes('already been registered')) {
      setAuthMsg('Username già in uso', 'err');
    } else {
      setAuthMsg(msg || 'Errore registrazione', 'err');
    }
    btn.disabled = false; btn.textContent = 'Crea account →';
  }
}

async function doLogout() {
  try { await sbSignOut(); } catch(e) {}
  currentUser = null; currentProfile = null;
  myPlaces = []; viewingPlaces = []; viewingUser = null; selId = null;
  window._sheetReady = false;
  closeProfile();
  hide('appNav'); hide('sheet');
  show('authScreen'); hide('loadingScreen');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('authMsg').innerHTML = '';
  $('lUser').value = ''; $('lPass').value = '';
  authTab('login');
}


async function deleteAccount(){
  if(!confirm('Sei sicuro? Tutti i tuoi luoghi verranno eliminati definitivamente.')) return;
  if(!confirm('Ultima conferma — eliminare account e dati?')) return;
  try{
    // Delete all places
    await sb.from('places').delete().eq('user_id', currentUser.id);
    // Mark profile as deleted (blocks future login)
    await sb.from('profiles').update({
      username: 'deleted_' + currentUser.id.slice(0,8),
      display_name: '[eliminato]',
      deleted: true
    }).eq('id', currentUser.id);
  }catch(e){ console.warn(e); }
  try{ await sbSignOut(); }catch(e){}
  currentUser=null; currentProfile=null; myPlaces=[]; viewingPlaces=[]; viewingUser=null; selId=null;
  window._sheetReady=false;
  closeProfile();
  hide('appNav'); hide('sheet');
  show('authScreen'); hide('loadingScreen');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('authMsg').innerHTML='<div class="msg-ok">Account eliminato. I tuoi dati sono stati cancellati.</div>';

}

  map = L.map('map', { center: [42.5, 12.5], zoom: 6, zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

  }).addTo(map);

function makeIcon(p, sel) {
  const mine = isMyMap();
  const col = mine ? (p.status === 'done' ? '#1D9E75' : '#D85A30') : '#7C6AC4';
  const em = IC[p.category] || '📍';
  const r = sel ? 20 : 15;
  const pulse = sel ? '<circle cx="29" cy="24" r="22" fill="' + col + '" opacity=".15"/>' : '';
  return L.divIcon({
    html: '<svg width="' + (r*2+10) + '" height="' + (r*2+20) + '" viewBox="0 0 58 62" xmlns="http://www.w3.org/2000/svg">' +
      pulse + '<circle cx="29" cy="24" r="' + r + '" fill="' + col + '"/>' +
      '<circle cx="29" cy="24" r="' + (r-3) + '" fill="rgba(255,255,255,.2)"/>' +
      '<text x="29" y="30" text-anchor="middle" font-size="' + (r-1) + '">' + em + '</text>' +
      '<path d="M29 46 L23 34 Q29 39 35 34Z" fill="' + col + '"/></svg>',
    className: '', iconSize: [r*2+10, r*2+20], iconAnchor: [r+5, r*2+20]
  });
}

let _lastRenderKey = '';
function renderMap() {
  if (!mapReady) return;
  const places = activePlaces();
  // Full rebuild only when places list or selection changes
  const renderKey = places.map(p => p.id + p.status + p.stars).join(',') + '|' + (selId || '');
  if (renderKey === _lastRenderKey) return;
  _lastRenderKey = renderKey;
  Object.values(mapMarkers).forEach(m => map.removeLayer(m));
  mapMarkers = {};
  places.forEach(p => {
    if (!p.lat || !p.lng) return;
    const sel = selId === p.id;
    const mine = isMyMap();
    const col = mine ? (p.status === 'done' ? '#085041' : '#D85A30') : '#5b4fad';
    const bg = mine ? (p.status === 'done' ? '#E1F5EE' : '#FAECE7') : '#ede8fc';
    const lbl = mine ? (p.status === 'done' ? '✓ Già provato' : '● Da provare') : '📌 ' + (viewingUser?.username || 'Utente');
    const m = L.marker([p.lat, p.lng], { icon: makeIcon(p, sel), zIndexOffset: sel ? 1000 : 0 });
    m.bindPopup(
      '<div style="padding:11px 14px;font-family:\'DM Sans\',sans-serif;min-width:160px">' +
      '<div style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:#BA7517;margin-bottom:3px">' + (IC[p.category] || '') + ' ' + p.category + '</div>' +
      '<div style="font-size:14px;font-weight:500;font-family:\'Playfair Display\',serif;line-height:1.25;margin-bottom:2px">' + p.name + '</div>' +
      '<div style="font-size:11px;color:#78716c;margin-bottom:6px">' + p.city + (p.region ? ', ' + p.region : '') + '</div>' +
      (p.stars ? '<div style="font-size:12px;color:#BA7517;margin-bottom:5px">' + '★'.repeat(p.stars) + '</div>' : '') +
      '<span style="font-size:10px;font-weight:500;padding:2px 9px;border-radius:20px;background:' + bg + ';color:' + col + '">' + lbl + '</span>' +
      '</div>',
      { maxWidth: 240, closeButton: false, autoPan: false }
    );
    m.on('click', () => { selId = p.id; renderMap(); renderSheet(); openDrawer(p.id); });
    if (sel) setTimeout(() => m.openPopup(), 80);
    m.addTo(map);
    mapMarkers[p.id] = m;
  });
  // Update zoom control position to avoid sheet overlap
  if (map.zoomControl) map.zoomControl.setPosition('bottomright');
}

// ─── BOTTOM SHEET ─────────────────────────────────────────
const PEEK = () => window.innerHeight - 72 - 52;
const HALF = () => window.innerHeight * 0.45;
const FULL = () => 60;

function initSheet() {
  const sheet = $('sheet');
  const drag = $('sheetDrag');
  sheet.style.height = (window.innerHeight - 52) + 'px';
  setSnap('peek', false);
  drag.addEventListener('touchstart', e => {
    sheetDragging = true; dragStartY = e.touches[0].clientY; dragStartTY = curTY;
    sheet.style.transition = 'none';
  }, { passive: true });
  drag.addEventListener('touchmove', e => {
    if (!sheetDragging) return;
    const dy = e.touches[0].clientY - dragStartY;
    const ny = Math.max(FULL() - 10, Math.min(dragStartTY + dy, PEEK() + 20));
    curTY = ny; sheet.style.transform = 'translateY(' + ny + 'px)';
  }, { passive: true });
  drag.addEventListener('touchend', e => {
    if (!sheetDragging) return; sheetDragging = false; sheet.style.transition = '';
    const dy = e.changedTouches[0].clientY - dragStartY;
    setSnap(dy < -60 ? (snapState === 'peek' ? 'half' : 'full') : dy > 60 ? (snapState === 'full' ? 'half' : 'peek') : snapState);
  });
  drag.addEventListener('click', () => setSnap(snapState === 'peek' ? 'half' : snapState === 'half' ? 'full' : 'peek'));
  window.addEventListener('resize', () => { sheet.style.height = (window.innerHeight - 52) + 'px'; setSnap(snapState, false); });
}

function setSnap(s, anim = true) {
  snapState = s;
  const sheet = $('sheet');
  sheet.style.transition = anim ? 'transform .35s cubic-bezier(.32,.72,0,1)' : 'none';
  const ty = s === 'full' ? FULL() : s === 'half' ? HALF() : PEEK();
  curTY = ty; sheet.style.transform = 'translateY(' + ty + 'px)';
  if (!anim) requestAnimationFrame(() => sheet.style.transition = '');
}

let _searchTimer = null;
function debounceSearch(inp) {
  $('clrBtn').style.display = inp.value ? 'block' : 'none';
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => renderSheet(), 150);
}
function onSearch(inp) {
  $('clrBtn').style.display = inp.value ? 'block' : 'none';
  renderSheet();
}
function clearSearch() {
  $('sheetSearch').value = '';
  $('clrBtn').style.display = 'none';
  renderSheet();
}
function setSheetF(f, el) {
  sheetFilter = f;
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  renderSheet();
}

function getSheetItems() {
  const q = ($('sheetSearch')?.value || '').toLowerCase();
  return activePlaces().filter(p => {
    if (sheetFilter === 'todo' && p.status !== 'todo') return false;
    if (sheetFilter === 'done' && p.status !== 'done') return false;
    if (q) return p.name.toLowerCase().includes(q) || p.city.toLowerCase().includes(q) || (p.region || '').toLowerCase().includes(q);
    return true;
  });
}

function renderSheet() {
  const items = getSheetItems();
  $('sheetCount').textContent = items.length;
  const el = $('sheetList');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-msg">Nessun luogo trovato</div></div>';
    return;
  }
  let html = '';
  if (sheetFilter === 'all') {
    const todo = items.filter(p => p.status === 'todo');
    const done = items.filter(p => p.status === 'done');
    if (todo.length) html += '<div class="sec-head"><span style="width:7px;height:7px;border-radius:50%;background:var(--r);display:inline-block"></span>Da provare (' + todo.length + ')</div>' + todo.map(pItemHtml).join('');
    if (done.length) html += '<div class="sec-head"><span style="width:7px;height:7px;border-radius:50%;background:var(--g);display:inline-block"></span>Già provati (' + done.length + ')</div>' + done.map(pItemHtml).join('');
  } else {
    html = items.map(pItemHtml).join('');
  }
  el.innerHTML = html;
}

function pItemHtml(p) {
  const mine = isMyMap();
  const acts = mine
    ? (p.status === 'todo' ? '<button class="ibtn ibtn-check" onclick="quickDone(event,\'' + p.id + '\')" title="Provato">✓</button>' : '') +
      '<button class="ibtn ibtn-del" onclick="quickDel(event,\'' + p.id + '\')" title="Elimina">🗑</button>'
    : '<button class="ibtn ibtn-save" onclick="copyToMyMap(event,\'' + p.id + '\')" title="Salva">🔖</button>';
  return '<div class="pitem' + (selId === p.id ? ' sel' : '') + '" onclick="tapItem(\'' + p.id + '\')">' +
    '<div class="pitem-icon ' + (mine ? p.status : 'other') + '">' + (IC[p.category] || '📍') + '</div>' +
    '<div class="pitem-body">' +
    '<div class="pitem-name">' + p.name + '</div>' +
    '<div class="pitem-meta">' + p.city + (p.region ? ' · ' + p.region : '') + (p.stars ? ' <span class="pitem-stars">' + '★'.repeat(p.stars) + '</span>' : '') + '</div>' +
    '</div><div class="ibtns">' + acts + '</div></div>';
}

function tapItem(id) {
  selId = id;
  const p = activePlaces().find(x => x.id === id);
  if (!p) return;
  renderMap(); renderSheet();
  if (p.lat && p.lng && map) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 13), { animate: true, duration: .6 });
  setSnap('peek');
  setTimeout(() => openDrawer(id), 300);
}

async function quickDone(e, id) {
  e.stopPropagation();
  const p = myPlaces.find(x => x.id === id);
  if (!p) return;
  p.status = 'done'; p.visited = today();
  renderSheet(); renderMap(); showToast('✓ Segnato come provato!');
  syncDot('syncing');
  try { await dbUpdatePlace(id, { status: 'done', visited: today() }); syncDot('ok'); } catch(e) { syncDot('off'); }
}

async function quickDel(e, id) {
  e.stopPropagation();
  const p = myPlaces.find(x => x.id === id);
  if (!p || !confirm('Eliminare "' + p.name + '"?')) return;
  myPlaces = myPlaces.filter(x => x.id !== id);
  if (selId === id) { selId = null; closeDrawer(); }
  renderSheet(); renderMap(); showToast('Luogo eliminato');
  syncDot('syncing');
  try { await dbDeletePlace(id); syncDot('ok'); } catch(e) { syncDot('off'); }
}

async function copyToMyMap(e, id) {
  e.stopPropagation();
  await _doCopy(id);
}

async function _doCopy(id) {
  const p = viewingPlaces.find(x => x.id === id);
  if (!p) return;
  const copy = Object.assign({}, p, { id: 'tmp_' + Date.now(), status: 'todo', stars: 0, note: '', visited: null, user_id: currentUser.id, created: today() });
  myPlaces.unshift(copy);
  showToast('🔖 Salvato nella tua mappa!');
  syncDot('syncing');
  try {
    const saved = await dbInsertPlace(copy);
    myPlaces = myPlaces.map(x => x.id === copy.id ? saved : x);
    syncDot('ok');
  } catch(err) {
    syncDot('off');
    myPlaces = myPlaces.filter(x => x.id !== copy.id);
  }
}

// ─── DRAWER ──────────────────────────────────────────────
function openDrawer(id) {
  const p = activePlaces().find(x => x.id === id);
  if (!p) return;
  editNote = false;
  renderDrawer(p);
  $('drawer').classList.add('open');
  $('dim').classList.add('on');
}

function closeDrawer() {
  $('drawer').classList.remove('open');
  $('dim').classList.remove('on');
  selId = null; editNote = false;
  renderMap(); renderSheet();
}

function renderDrawer(p) {
  const mine = isMyMap();
  $('dHead').innerHTML =
    '<div class="dcat">' + (IC[p.category] || '') + ' ' + p.category + '</div>' +
    '<div class="dname">' + p.name + '</div>' +
    '<div class="daddr">' + [p.address, p.city, p.region].filter(Boolean).join(', ') + '</div>' +
    (!mine && viewingUser ? '<div class="downer">📌 Mappa di <strong>' + viewingUser.username + '</strong></div>' : '') +
    '<div class="dbadges">' +
    '<span class="badge badge-' + p.status + '">' + (p.status === 'done' ? '✓ Già provato' : '● Da provare') + '</span>' +
    (p.visited ? '<span style="font-size:11px;color:var(--t3)">' + fmtD(p.visited) + '</span>' : '') +
    '</div>';

  const stars = [1,2,3,4,5].map(n =>
    '<span class="star' + (n <= p.stars ? ' on' : '') + '"' +
    (mine ? ' onclick="setStar(\'' + p.id + '\',' + n + ')"' : '') + '>★</span>'
  ).join('');

  let noteHtml;
  if (mine) {
    noteHtml = editNote
      ? '<textarea class="note-area" id="noteEdit" rows="3">' + (p.note || '') + '</textarea>' +
        '<button class="mini-save" onclick="saveNote(\'' + p.id + '\')">Salva</button>' +
        '<button class="mini-cancel" onclick="cancelNote(\'' + p.id + '\')">Annulla</button>'
      : '<div class="note-display' + (!p.note ? ' empty' : '') + '" onclick="startNote(\'' + p.id + '\')">' +
        (p.note || 'Tocca per aggiungere una nota...') + '</div>' +
        '<div class="note-hint">Tocca per modificare</div>';
  } else {
    noteHtml = p.note ? '<div class="note-display">' + p.note + '</div>' : '<div class="note-display empty">Nessuna nota</div>';
  }

  $('dBody').innerHTML =
    '<div class="slabel">Valutazione</div>' +
    '<div class="stars-row">' + stars + '</div>' +
    '<div class="slabel">Note' + (mine ? ' personali' : '') + '</div>' + noteHtml +
    (mine && p.status === 'done'
      ? '<div class="slabel">Data visita</div><input class="date-field" type="date" value="' + (p.visited || '') + '" onchange="setVisit(\'' + p.id + '\',this.value)">'
      : '') +
    '<div style="font-size:11px;color:var(--t3);margin-top:14px">Aggiunto il ' + fmtD(p.created) + '</div>';

  // Build best Maps URL:
  // 1. Saved original Google Maps link (opens exact place)
  // 2. Coordinates with place name (very precise)
  // 3. Name + city search (fallback)
  let mapsUrl;
  if (p.gmUrl && p.gmUrl.includes('google.com/maps')) {
    mapsUrl = p.gmUrl;
  } else if (p.gmUrl && (p.gmUrl.includes('goo.gl') || p.gmUrl.includes('maps.app'))) {
    mapsUrl = p.gmUrl; // Short link — still works to open Maps
  } else if (p.lat && p.lng) {
    // Build a proper place link with name + coordinates
    mapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(p.name) + '/@' + p.lat + ',' + p.lng + ',17z';
  } else {
    mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.name, p.address, p.city].filter(Boolean).join(', '));
  }

  let foot = '';
  if (mine) {
    if (p.status === 'todo') foot += '<button class="btn-full btn-green" onclick="markDone(\'' + p.id + '\')">✓ Segna come provato</button>';
  } else {
    foot += '<button class="btn-full btn-gold" onclick="_doCopy(\'' + p.id + '\');closeDrawer()">🔖 Salva nella mia mappa</button>';
  }
  foot += '<a class="btn-full btn-gray" href="' + mapsUrl + '" target="_blank" rel="noopener noreferrer">↗ Apri in Google Maps</a>';
  if (mine) foot += '<button class="btn-full btn-red" onclick="delFromDrawer(\'' + p.id + '\')">🗑 Elimina luogo</button>';
  $('dFoot').innerHTML = foot;
}

function pCardHtml(p) {
  return '<div class="pcard" onclick="goToMap(\'' + p.id + '\')">' +
    '<div class="pcard-bar ' + p.status + '"></div>' +
    '<span class="pcard-ico">' + (IC[p.category] || '📍') + '</span>' +

    '<div class="pcard-name">' + p.name + '</div>' +

async function listDone(e, id) {
  e.stopPropagation();
  const p = myPlaces.find(x => x.id === id);
  if (!p) return;
  p.status = 'done'; p.visited = today();
  renderList(); renderMap(); showToast('✓ Segnato come provato!');
  syncDot('syncing');
  try { await dbUpdatePlace(id, { status: 'done', visited: today() }); syncDot('ok'); } catch(e) { syncDot('off'); }
}

async function listDel(e, id) {
  e.stopPropagation();
  const p = myPlaces.find(x => x.id === id);
  if (!p || !confirm('Eliminare "' + p.name + '"?')) return;
  myPlaces = myPlaces.filter(x => x.id !== id);
  renderList(); renderMap(); showToast('Luogo eliminato');
  syncDot('syncing');
  try { await dbDeletePlace(id); syncDot('ok'); } catch(e) { syncDot('off'); }
}

// ─── DASHBOARD ───────────────────────────────────────────
function renderDash() {
  const pl = myPlaces;
  const done = pl.filter(p => p.status === 'done').length;
  const todo = pl.length - done;
  const rated = pl.filter(p => p.stars > 0);
  const avg = rated.length ? (rated.reduce((s, p) => s + p.stars, 0) / rated.length).toFixed(1) : 0;
  const pct = pl.length ? Math.round(done / pl.length * 100) : 0;
  const cats = {}, regs = {};
  pl.forEach(p => { cats[p.category] = (cats[p.category] || 0) + 1; if (p.region) regs[p.region] = (regs[p.region] || 0) + 1; });
  const tc = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const tr = Object.entries(regs).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const mc = tc[0]?.[1] || 1, mr = tr[0]?.[1] || 1;
  const top = [...pl].filter(p => p.stars > 0).sort((a, b) => b.stars - a.stars).slice(0, 5);

  $('dashInner').innerHTML =
    '<div class="stats2">' +
    '<div class="scard" style="background:var(--gl)"><div class="scard-n" style="color:var(--gd)">' + pl.length + '</div><div class="scard-l" style="color:var(--gd)">Totale luoghi</div></div>' +
    '<div class="scard" style="background:var(--rl)"><div class="scard-n" style="color:var(--r)">' + todo + '</div><div class="scard-l" style="color:var(--r)">Da provare</div></div>' +
    '<div class="scard" style="background:var(--gl)"><div class="scard-n" style="color:var(--gd)">' + done + '</div><div class="scard-l" style="color:var(--gd)">Già provati</div></div>' +
    '<div class="scard" style="background:var(--ol)"><div class="scard-n" style="color:var(--o)">' + (avg > 0 ? avg + '★' : '—') + '</div><div class="scard-l" style="color:var(--o)">Media stelle</div></div>' +
    '</div>' +
    (pl.length ? '<div class="prog-card"><div class="prog-lbl"><span>Progressi</span><span style="font-weight:500">' + pct + '%</span></div><div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div><div class="prog-sub"><span style="color:var(--gd)">' + done + ' provati</span><span style="color:var(--r)">' + todo + ' da provare</span></div></div>' : '') +
    '<div class="chart-card"><div class="chart-t">Per categoria</div>' + tc.map(([k, v]) => '<div class="bar-row"><div class="bar-lbl">' + (IC[k] || '') + ' ' + k + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(v/mc*100) + '%;background:var(--o)"></div></div><div class="bar-n">' + v + '</div></div>').join('') + '</div>' +
    (tr.length ? '<div class="chart-card"><div class="chart-t">Per regione</div>' + tr.map(([k, v]) => '<div class="bar-row"><div class="bar-lbl">' + k + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(v/mr*100) + '%;background:var(--g)"></div></div><div class="bar-n">' + v + '</div></div>').join('') + '</div>' : '') +
    (top.length ? '<div class="top-card"><div class="chart-t">I miei migliori ⭐</div>' + top.map((p, i) => '<div class="top-row" onclick="goToMap(\'' + p.id + '\')"><span style="font-size:11px;color:var(--t3);width:16px">' + (i+1) + '</span><span style="font-size:16px">' + (IC[p.category] || '') + '</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + p.name + '</div><div style="font-size:11px;color:var(--t2)">' + p.city + '</div></div><span style="font-size:12px;color:var(--o)">' + '★'.repeat(p.stars) + '</span></div>').join('') + '</div>' : '');
}

// Helper: Nominatim fetch with 5s timeout
async function nominatimFetch(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const r = await fetch(url, {
      headers: { 'Accept-Language': 'it', 'User-Agent': 'ItalySpots/1.0' },
      signal: controller.signal
    });
    clearTimeout(timer);
    return await r.json();
  } catch(e) { clearTimeout(timer); return null; }
}

// Helper: extract coordinates from any Google Maps URL format
function extractCoordsFromUrl(url) {
  // Pattern !3d lat !4d lng (desktop links)
  const p4 = url.match(/!3d(-?[0-9]+\.[0-9]+).*?!4d(-?[0-9]+\.[0-9]+)/);
  if (p4) return { lat: parseFloat(p4[1]), lng: parseFloat(p4[2]) };
  // Pattern @lat,lng
  const p1 = url.match(/@(-?[0-9]+\.[0-9]+),(-?[0-9]+\.[0-9]+)/);
  if (p1) return { lat: parseFloat(p1[1]), lng: parseFloat(p1[2]) };
  // Pattern ?q=lat,lng or ll=lat,lng
  const p2 = url.match(/[?&](?:q|ll|center)=(-?[0-9]+\.[0-9]+),(-?[0-9]+\.[0-9]+)/);
  if (p2) return { lat: parseFloat(p2[1]), lng: parseFloat(p2[2]) };
  // Pattern maps/@lat,lng
  const p3 = url.match(/maps\/@?(-?[0-9]+\.[0-9]+),(-?[0-9]+\.[0-9]+)/);
  if (p3) return { lat: parseFloat(p3[1]), lng: parseFloat(p3[2]) };
  return null;
}

// Helper: extract place name from Google Maps URL
function extractPlaceNameFromUrl(url) {
  const m = url.match(/\/place\/([^\/\/@?&\n+,]+)/);
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ').replace(/_/g,' ')).trim() : '';
}

// Helper: parse Nominatim address fields
function parseNominatimAddr(d) {
  const a = d.address || {};
  return {
    name: d.name || (d.display_name||'').split(',')[0] || '',
    city: a.city || a.town || a.village || a.municipality || a.suburb || a.county || '',
    region: a.state || '',
    address: (a.road || '') + (a.house_number ? ' ' + a.house_number : '')
  };
}

// ─── GEOCODE ─────────────────────────────────────────────
async function doGeo() {
  const rawInput = $('gmIn').value.trim();
  if (!rawInput) { $('urlMsg').innerHTML = '<div class="msg-err">Incolla un link Google Maps o scrivi il nome del posto.</div>'; return; }

  const btn = $('geoBtn'); const txt = $('geoTxt');
  txt.textContent = '⏳ Ricerca...'; btn.disabled = true;
  $('urlMsg').innerHTML = ''; $('urlRes').innerHTML = '';

  let raw = rawInput;
  let lat = null, lng = null, name = '', city = '', region = '', address = '';
  const isHttp = raw.startsWith('http');
  const isShort = raw.includes('goo.gl') || raw.includes('maps.app');

  // Step 1: resolve short link to get full URL with coordinates
  if (isShort) {
    txt.textContent = '⏳ Risolvo link...';
    try {
      // Use allorigins to follow redirect and get final URL
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(raw);
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 6000);
      const r = await fetch(proxyUrl, { signal: controller.signal });
      const d = await r.json();
      // The final URL is in the contents or we can parse the response URL
      if (d && d.status && d.status.url) {
        raw = d.status.url; // This is the resolved URL
      } else if (d && d.contents) {
        // Try to extract redirect URL from HTML content
        const urlMatch = d.contents.match(/https:\/\/www\.google\.com\/maps[^"'\s]+/);
        if (urlMatch) raw = urlMatch[0];
      }
    } catch(e) {
      // Proxy failed — try alternative
      try {
        const r2 = await nominatimFetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(raw));
        // If we got HTML back, extract maps URL
        if (typeof r2 === 'string') {
          const m = r2.match(/https:\/\/www\.google\.com\/maps[^"'\s<>]+/);
          if (m) raw = m[0];
        }
      } catch(e2) {}
    }
    txt.textContent = '⏳ Ricerca...';
  }

  // Step 2: extract coords from (possibly resolved) URL
  if (raw.startsWith('http')) {
    const coords = extractCoordsFromUrl(raw);
    if (coords) { lat = coords.lat; lng = coords.lng; }
  }

  // Step 3: extract place name from URL
  const placeName = raw.startsWith('http') ? extractPlaceNameFromUrl(raw) : '';

  // Step 4: reverse geocode if we have coords
  if (lat && lng) {
    const d = await nominatimFetch(
      'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng +
      '&format=json&addressdetails=1&zoom=16'
    );
    if (d && !d.error) {
      const p = parseNominatimAddr(d);
      // Prefer the name from Google Maps URL over Nominatim generic name
      name = placeName || p.name;
      city = p.city; region = p.region; address = p.address;
    }
    if (!name) name = placeName;
  }

  // Step 5: forward geocode by name if still no coords
  const searchText = raw.startsWith('http') ? placeName : rawInput;
  if (!lat && searchText) {
    // Try exact name first, then with "Italia" appended
    let d = await nominatimFetch(
      'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(searchText) +
      '&format=json&limit=1&addressdetails=1&countrycodes=it'
    );
    if (!d || !d[0]) {
      d = await nominatimFetch(
        'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(searchText + ' Italia') +
        '&format=json&limit=1&addressdetails=1&countrycodes=it'
      );
    }
    if (d && d[0]) {
      lat = parseFloat(d[0].lat); lng = parseFloat(d[0].lon);
      const p = parseNominatimAddr(d[0]);
      name = p.name || searchText; city = p.city; region = p.region; address = p.address;
    }
  }

  btn.disabled = false; txt.textContent = '🔍 Trova luogo';

  if (!lat || !lng) {
    let msg = '<div class="msg-err">Posto non trovato.';
    if (isShort && raw === rawInput) {
      // Short link couldn't be resolved
      msg += '<br><br>⚠️ <strong>Link breve non risolto.</strong><br>' +
        '1. Apri il link nel browser<br>' +
        '2. Copia l\'URL dalla barra degli indirizzi (quello lungo con google.com/maps/...)<br>' +
        '3. Incollalo qui';
    }
    msg += '<br><br>💡 Oppure usa <strong>Manuale ✏️</strong> e scrivi nome + città, es: <em>Pizzeria Brandi Napoli</em></div>';
    $('urlMsg').innerHTML = msg;
    return;
  }

  // Validate Italy bounds
  if (lat < 35 || lat > 48 || lng < 5 || lng > 20) {
    $('urlMsg').innerHTML = '<div class=\"msg-err\">Coordinate fuori dall\'Italia. Usa il tab Manuale e scrivi il nome del posto.</div>';
    btn.disabled = false; return;
  }

  // Save the best available URL for "Apri in Google Maps"
  // Prefer the original long URL, fall back to resolved URL
  const bestUrl = rawInput.includes('google.com/maps') ? rawInput :
                  raw.includes('google.com/maps') ? raw : rawInput;

  geocoded = { lat, lng, gmUrl: bestUrl };
  if (name) $('fName').value = name;
  if (city) $('fCity').value = city;
  if (region) $('fRegion').value = region;
  if (address) $('fAddr').value = address;
  $('coordHint').innerHTML = '📍 ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
  $('urlRes').innerHTML =
    '<div class="msg-ok" style="margin-top:10px">✅ <strong>' + (name || 'Luogo trovato') + '</strong>' +
    (city ? ', ' + city : '') + '</div>' +
    '<button class="pbtn" style="margin-top:6px" onclick="confirmGeo()">Continua → Completa i dettagli</button>';
}

function confirmGeo() {
  confirmed = true;
  $('urlFlow').style.display = 'none';
  $('formFlow').style.display = 'block';
  $('backBtn').style.display = 'inline-flex';
  $('fMsg').innerHTML = '<div class="msg-ok" style="margin-bottom:12px">✅ Posizione trovata! Controlla i dati e salva.</div>';
}

function backUrl() {
  confirmed = false;
  $('urlFlow').style.display = 'block';
  $('formFlow').style.display = 'none';
}

async function savePlace() {
  const name = $('fName').value.trim();
  const city = $('fCity').value.trim();
  if (!name || !city) { $('fErr').innerHTML = '<div class="msg-err">Nome e città sono obbligatori.</div>'; return; }

  const status = $('fStat').value;
  const p = {
    id: 'tmp_' + Date.now(), name, city,
    region: $('fRegion').value.trim(),
    address: $('fAddr').value.trim(),
    category: $('fCat').value,
    status,
    stars: parseInt($('fStars').value) || 0,
    note: $('fNote').value.trim(),
    gmUrl: geocoded?.gmUrl || ($('gmIn')?.value || '').trim(),
    lat: geocoded?.lat || null,
    lng: geocoded?.lng || null,
    visited: status === 'done' ? ($('fVisit').value || today()) : null,
    created: today(),
    user_id: currentUser?.id
  };

  const tmpId = p.id;
  myPlaces.unshift(p);
  closeModal(); renderAll();
  showToast('💾 Salvataggio...');
  syncDot('syncing');

  try {
    const saved = await dbInsertPlace(p);
    myPlaces = myPlaces.map(x => x.id === tmpId ? saved : x);
    renderAll(); showToast('✅ ' + name + ' aggiunto!'); syncDot('ok');
    if (saved.lat && saved.lng && map) {
      selId = saved.id; showView('map');
      setTimeout(() => {
        map.flyTo([saved.lat, saved.lng], 14, { animate: true, duration: .8 });
        renderMap(); renderSheet();
        setTimeout(() => openDrawer(saved.id), 900);
      }, 200);
    }
  } catch(err) {
    syncDot('off');
    showToast('⚠️ Errore salvataggio — riprova');
    myPlaces = myPlaces.filter(x => x.id !== tmpId);
    renderAll();
  }
}

// ─── TOAST ───────────────────────────────────────────────
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── INIT ────────────────────────────────────────────────
window.addEventListener('load', async () => {
  // Init map (Leaflet already loaded at this point)
  initMap();

  // Init Supabase
  if (!initSupabase()) {
    $('authMsg').innerHTML = '<div class="msg-err">Errore caricamento. Ricarica la pagina.</div>';
    return;
  }

  // Try restore session (3s timeout)
  try {
    const session = await Promise.race([
      sbGetSession(),
      new Promise(r => setTimeout(() => r(null), 3000))
    ]);
    if (session?.user) {
      currentUser = { id: session.user.id, email: session.user.email };
      try {
        await Promise.race([
          afterLogin(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
        ]);
        return;
      } catch(e) {
        console.warn('Session restore failed:', e.message);
        try { await sbSignOut(); } catch(e2) {}
        currentUser = null; currentProfile = null;
      }
    }
  } catch(e) {
    console.warn('Session check error:', e);
  }

  // Show login
  hide('loadingScreen');
  show('authScreen');
});
